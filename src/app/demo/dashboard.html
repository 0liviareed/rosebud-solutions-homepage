<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosebud Solutions · Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171320; --ink-2:#514c5d; --ink-3:#69647a; --ink-4:#8b869a;
  --purple:#6c5cae;
  --purple-deep:color-mix(in oklab, var(--purple) 76%, #14102a);
  --purple-mid:color-mix(in oklab, var(--purple) 66%, #ffffff);
  --purple-soft:color-mix(in oklab, var(--purple) 11%, #ffffff);
  --purple-soft-2:color-mix(in oklab, var(--purple) 5%, #ffffff);
  --bd-purple:color-mix(in oklab, var(--purple) 26%, #ffffff);
  --clay:#8a7358; --clay-soft:#f7f2ec;
  --chrome:#f2f0f7; --chrome-2:#e8e5f0;
  --canvas:#faf9f7;
  --desk:#e8e6e2;
  --panel:#fbfaf9; --panel-2:#fff;
  --bd:#eceae6; --bd-2:#dfdcd6;
  --line:#d7d3cc;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
  --rail:258px; --insp:336px;
  --r-card:14px; --r-ctl:10px;
  --sh-1:0 1px 2px rgba(24,20,40,.05);
  --glass:color-mix(in oklab,var(--panel-2) 70%,transparent);
  --glass-2:color-mix(in oklab,var(--panel-2) 52%,transparent);
  --glass-bd:color-mix(in oklab,#fff 52%,var(--bd));
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.72);
  --blur:blur(16px) saturate(1.4);
  --sh-2:0 1px 2px rgba(24,20,40,.05), 0 10px 26px -16px rgba(24,20,40,.28);
  --sh-3:0 26px 70px -24px rgba(24,20,40,.42), 0 2px 6px rgba(24,20,40,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--sans);font-size:13.5px;line-height:1.5;color:var(--ink-2);
  background:var(--panel-2);height:100vh;overflow:hidden}
a{color:var(--purple-deep);text-decoration:none}
a:hover{color:var(--purple)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column;background:var(--panel-2);overflow:hidden}
.lbl{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-4)}

/* rail head + account */
.rhead{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.bm{width:34px;height:34px;border-radius:50%;flex:none;display:block;
  box-shadow:0 4px 14px -6px rgba(24,20,40,.55)}
.bn{font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1.05;letter-spacing:.005em;min-width:0}
.bn s{display:block;text-decoration:none;font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-4);margin-top:5px}
.acct{margin-top:auto;padding:10px;border-top:1px solid var(--line)}
.acct-b{width:100%;display:grid;grid-template-columns:30px 1fr 12px;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--r-ctl);text-align:left;transition:background .14s}
.acct-b:hover{background:var(--panel-2)}
.acct-b:active{background:var(--chrome-2)}
.acct-b:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}
.acct-a{width:30px;height:30px;border-radius:9px;background:var(--purple-soft);border:1px solid var(--bd-purple);
  display:grid;place-items:center;font-family:var(--serif);font-size:15px;color:var(--purple-deep)}
.acct-n{display:block;font-size:13px;color:var(--ink);line-height:1.25;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-m{display:block;font-family:var(--sans);font-size:11px;letter-spacing:0;color:var(--ink-4);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-b>*{min-width:0}
.acct-c{font-family:var(--sans);font-size:11px;color:var(--ink-4)}
img.acct-a{object-fit:cover;background:#fff;padding:2px}
.logo-p{width:52px;height:52px;border-radius:13px;background:var(--purple-soft);border:1px solid var(--bd-purple);
  display:grid;place-items:center;font-family:var(--serif);font-size:24px;color:var(--purple-deep);flex:none;overflow:hidden}
img.logo-p{object-fit:cover;background:#fff;padding:3px}
.logo-r{display:flex;align-items:center;gap:14px}
.logo-a{display:flex;gap:8px;margin-top:9px}
.greet{margin-bottom:2px}
.greet-t{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1.1;letter-spacing:-.005em}
.greet-s{font-size:13px;color:var(--ink-3);line-height:1.55;margin-top:7px;max-width:70ch}
.dot{width:7px;height:7px;border-radius:50%;background:var(--purple);flex:none;
  box-shadow:0 0 0 3px color-mix(in oklab,var(--purple) 18%,transparent)}

/* system status strip (dashboard) */
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(134px,1fr));gap:1px;background:transparent}
.si{background:var(--glass-2);padding:13px 15px;min-width:0;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 0 0 .5px var(--bd)}
.si-k{color:var(--ink-4);font-size:11px;font-family:var(--sans);font-weight:500;letter-spacing:.01em}
.si-v{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:15px;font-weight:600;
  color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.si-v.p{color:var(--purple-deep)}
.bar{width:100%;max-width:92px;height:4px;border-radius:3px;background:var(--bd-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--purple-mid);border-radius:3px}
body[data-sys="off"] .sys-panel{display:none}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) 1fr var(--insp);grid-template-rows:100%;
  flex:1;min-height:0;overflow:hidden;transition:grid-template-columns .22s ease}
.shell.shut{grid-template-columns:var(--rail) 1fr 0}
.shell.shut .insp{opacity:0;pointer-events:none}
.ipin{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;border-radius:var(--r-ctl);
  border:1px solid var(--bd-2);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  font-family:var(--sans);font-size:12px;
  letter-spacing:0;color:var(--ink-3);flex:none;box-shadow:var(--glass-hi);
  transition:background .14s,color .14s,border-color .14s}
.ipin:hover{color:var(--ink);border-color:var(--line);background:var(--chrome)}
.ipin:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.ipin i{width:13px;height:11px;border-radius:2.5px;border:1.4px solid currentColor;position:relative;flex:none;font-style:normal}
.ipin i::after{content:'';position:absolute;top:0;bottom:0;right:0;width:4.5px;background:currentColor;
  border-radius:0 1px 1px 0}
.shell.shut~* .ipin i::after,.ipin.off i::after{background:none}
.ipin.off{color:var(--ink-4)}

/* mobile rail drawer — .railBtn only shows under the mobile breakpoint */
.railBtn{display:none;align-items:center;justify-content:center;width:34px;height:34px;flex:none;
  border-radius:var(--r-ctl);border:1px solid var(--bd-2);background:var(--glass);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--ink-3);
  box-shadow:var(--glass-hi);transition:background .14s,color .14s,border-color .14s}
.railBtn:hover{color:var(--ink);border-color:var(--line);background:var(--chrome)}
.railBtn:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.railBtn svg{width:17px;height:17px;display:block}
.rail-scrim{display:none;position:fixed;inset:0;z-index:110;background:rgba(23,19,31,.4);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

/* rail */
.rail{background:linear-gradient(180deg,var(--chrome) 0%,color-mix(in oklab,var(--chrome) 88%,var(--line)) 100%);
  border-right:1px solid var(--line);overflow-y:auto;min-height:0;display:flex;flex-direction:column;
  box-shadow:inset -1px 0 0 rgba(255,255,255,.5)}
.grp{padding:18px 18px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.grp.sep{margin-top:12px;padding-top:17px;border-top:1px solid color-mix(in oklab,var(--line) 55%,transparent)}
.grp .cnt{font-family:var(--sans);font-size:10.5px;letter-spacing:0;color:var(--ink-4)}
.navwrap{padding:0 10px;display:grid;gap:2px}
.nv{position:relative;width:100%;display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;
  padding:9px 11px;text-align:left;border-radius:var(--r-ctl);transition:background .14s,box-shadow .14s}
.nv::before{content:'';position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:3px;height:0;
  border-radius:0 3px 3px 0;background:var(--purple);transition:height .18s ease}
.nv:hover{background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.nv:active{background:var(--chrome-2)}
.nv:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}
.nv-i{justify-self:center;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  color:var(--ink-3);transition:background .14s,color .14s,box-shadow .14s}
.nv-i svg{width:17px;height:17px;display:block}
.nv-n{font-size:13px;color:var(--ink-2);line-height:1.3;min-width:0;text-wrap:pretty}
.nv-n s{display:block;text-decoration:none;font-family:var(--sans);font-size:11px;letter-spacing:0;
  color:var(--ink-4);margin-top:3px;line-height:1.35;text-wrap:pretty}
.nv.two{grid-template-columns:26px 1fr auto;align-items:flex-start;padding-top:10px;padding-bottom:10px}
.nv.two .nv-i{margin-top:-1px}
.nv-v{font-family:var(--sans);font-size:11px;color:var(--ink-4)}
.nv.dim .nv-i,.nv.dim .nv-n{opacity:.45}
.nv.dim .nv-n,.nv.dim .nv-i{color:var(--ink-4)}
.nv.dim .nv-i{background:var(--chrome-2)}
.off-pip{font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  background:var(--chrome-2);color:var(--ink-3);border:1px solid var(--bd-2);border-radius:999px;padding:2px 7px}
.nv.on{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line),0 1px 3px rgba(24,20,40,.09),
  0 8px 20px -14px color-mix(in oklab,var(--purple) 62%,transparent)}
.nv.on::before{height:22px}
.nv.on .nv-n{color:var(--ink);font-weight:600}
.nv.on .nv-n s{color:var(--purple-deep);font-weight:400}
.nv.on .nv-i{color:var(--purple);background:var(--purple-soft);box-shadow:inset 0 0 0 1px var(--bd-purple)}
.nv.on .nv-v{color:var(--ink-3)}
.badge{font-family:var(--mono);font-size:9.5px;min-width:20px;text-align:center;border-radius:999px;padding:2px 7px;
  background:var(--purple);color:#fff}
.badge.quiet{background:var(--bd-2);color:var(--ink-3)}

/* centre */
.mid{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel-2)}
.tb{display:flex;align-items:center;gap:12px;padding:0 18px;height:54px;background:var(--panel-2);
  border-bottom:1px solid var(--line);flex:none;z-index:1}
.tb-t{font-family:var(--serif);font-size:21px;color:var(--ink);line-height:1;letter-spacing:.005em}
.tb-m{font-family:var(--sans);font-size:12.5px;letter-spacing:0;color:var(--ink-4);
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.seg{display:flex;gap:2px;padding:3px;border-radius:11px;background:color-mix(in oklab,var(--chrome) 60%,transparent);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--bd-2);
  box-shadow:var(--glass-hi)}
.seg button{padding:5px 13px;border-radius:8px;font-family:var(--sans);font-size:12px;color:var(--ink-3);
  letter-spacing:0;transition:background .14s,box-shadow .14s,color .14s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:color-mix(in oklab,var(--panel-2) 88%,transparent);color:var(--purple-deep);
  box-shadow:var(--sh-1),var(--glass-hi)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:var(--pad,24px);background:var(--canvas);
  box-shadow:inset 0 1px 3px rgba(24,20,40,.07)}
.scroll.grid{background-color:var(--canvas);background-image:radial-gradient(circle at 1px 1px,#ddd9d3 1.1px,transparent 0);
  background-size:20px 20px}
.scroll.wash{background-color:var(--canvas);
  background-image:radial-gradient(120% 60% at 12% 0%,color-mix(in oklab,var(--purple) 7%,transparent),transparent 60%),
    radial-gradient(90% 55% at 100% 8%,color-mix(in oklab,var(--clay) 8%,transparent),transparent 62%);
  background-repeat:no-repeat}

/* toggle */
.sw{position:relative;display:block;width:34px;height:20px;border-radius:999px;background:var(--bd-2);flex:none;cursor:default}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(40,30,70,.28);transition:transform .16s}
.sw.on{background:var(--purple)}
.sw.on::after{transform:translateX(14px)}
.sw.gate{background:repeating-linear-gradient(135deg,var(--bd-2),var(--bd-2) 3px,var(--chrome) 3px,var(--chrome) 6px)}
.swx{display:flex;align-items:center;gap:10px}
.swl{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-4);min-width:56px;text-align:right}
.swl.on{color:var(--purple-deep)}
.incl{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.01em;color:var(--purple-deep);
  background:var(--purple-soft);border:1px solid var(--bd-purple);border-radius:999px;padding:3px 10px}

/* request a change */
.cta{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--purple-soft-2);
  border:1px solid var(--bd-purple);border-radius:var(--r-card);padding:16px 18px;margin-bottom:16px}
.cta-t{font-size:14px;color:var(--ink);font-weight:600}
.cta-s{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:4px;max-width:64ch}
.btn{font-size:12.5px;font-weight:500;color:#fff;background:var(--purple);border-radius:var(--r-ctl);padding:10px 16px;
  white-space:nowrap;box-shadow:0 6px 16px -8px color-mix(in oklab,var(--purple) 70%,transparent);transition:background .14s,transform .1s}
.btn:hover{background:var(--purple-deep)}
.btn.pulse{animation:cpulse .9s ease-out 2}
@keyframes cpulse{0%{box-shadow:0 6px 16px -8px color-mix(in oklab,var(--purple) 70%,transparent),0 0 0 0 color-mix(in oklab,var(--purple) 55%,transparent)}
  70%{box-shadow:0 6px 16px -8px color-mix(in oklab,var(--purple) 70%,transparent),0 0 0 9px transparent}
  100%{box-shadow:0 6px 16px -8px color-mix(in oklab,var(--purple) 70%,transparent),0 0 0 0 transparent}}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.btn.ghost{color:var(--purple-deep);background:var(--purple-soft);border:1px solid var(--bd-purple);box-shadow:none}
.btn.ghost:hover{background:color-mix(in oklab,var(--purple) 16%,#fff)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(23,19,32,.4);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:24px}
.md{width:100%;max-width:500px;background:var(--panel-2);border:1px solid var(--bd-2);border-radius:18px;
  box-shadow:var(--sh-3);overflow:hidden}
.md-h{padding:18px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.md-t{font-family:var(--serif);font-size:23px;color:var(--ink);line-height:1.2}
.md-s{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.55}
.md-x{font-family:var(--sans);font-size:15px;color:var(--ink-4);padding:4px 8px;border-radius:8px}
.md-x:hover{background:#f0edf6;color:var(--ink)}
.md-b{padding:18px 20px}
.md-f{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:9px;background:var(--panel)}
.fld{margin-bottom:14px}
.fld label{display:block;font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-3);margin-bottom:6px}
.fld select,.fld textarea,.fld input{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);
  border:1px solid var(--bd-2);border-radius:var(--r-ctl);padding:10px 12px;background:#fff;resize:vertical}
.fld textarea{min-height:88px;line-height:1.55}
.fld select:focus,.fld textarea:focus,.fld input:focus{outline:2px solid var(--purple);outline-offset:-1px;border-color:var(--purple)}
.am{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r-ctl);margin-bottom:15px}
.am-a{width:32px;height:32px;border-radius:10px;background:var(--purple-soft);border:1px solid var(--bd-purple);
  display:grid;place-items:center;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--purple-deep);flex:none}
.am-n{display:block;font-size:13px;color:var(--ink);line-height:1.25;font-weight:500}
.am-m{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);margin-top:3px}
.done{text-align:center;padding:26px 18px}
.done-m{width:40px;height:40px;border-radius:12px;background:var(--purple-soft);border:1px solid var(--bd-purple);
  display:grid;place-items:center;margin:0 auto 13px;color:var(--purple-deep);font-family:var(--sans);font-size:17px}
.done-t{font-family:var(--serif);font-size:22px;color:var(--ink)}
.done-s{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.55}

/* add-on upsell */
.md-upsell{width:100%;max-width:560px;border-radius:22px;border:1px solid var(--bd-2);
  box-shadow:var(--sh-3);overflow:hidden;position:relative;
  background:linear-gradient(180deg,var(--purple-soft) 0%,var(--panel-2) 280px)}
.upsell-x{position:absolute;top:16px;right:16px;font-family:var(--sans);font-size:15px;color:var(--ink-4);
  padding:4px 8px;border-radius:8px;z-index:1}
.upsell-x:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.upsell-body{padding:34px 34px 30px;text-align:center}
.upsell-eyebrow{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.08em;
  color:var(--purple-deep);text-transform:uppercase}
.upsell-h{font-family:var(--serif);font-size:27px;line-height:1.28;color:var(--ink);
  letter-spacing:-.005em;margin:16px 0}
.upsell-s{font-size:13.5px;color:var(--ink-3);line-height:1.65;max-width:420px;margin:0 auto 22px}
.upsell-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;text-align:left}
.upsell-card{background:var(--purple-soft-2);border:1px solid var(--bd-purple);border-radius:14px;
  padding:14px;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.upsell-card i{display:block;font-style:normal;color:var(--purple-deep);font-size:15px;margin-bottom:6px}
.upsell-note{font-size:12px;color:var(--ink-4);margin-bottom:20px}
.upsell-cta{width:100%;background:var(--purple);color:#fff;font-size:14px;font-weight:600;
  border-radius:12px;padding:15px;box-shadow:0 8px 20px -10px color-mix(in oklab,var(--purple) 60%,transparent);
  transition:background .14s}
.upsell-cta:hover{background:var(--purple-deep)}
.upsell-link{display:block;margin-top:14px;font-size:12.5px;color:var(--ink-3);
  text-decoration:underline;text-underline-offset:3px}
.upsell-link:hover{color:var(--purple-deep)}
@media (max-width:640px){.upsell-cards{grid-template-columns:1fr}}
.tr{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--bd)}
.tr:first-child{border-top:0}
.tr-n{font-size:13px;color:var(--ink);line-height:1.35}
.tr-n s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3);margin-top:3px}

/* limits + logs */
.lim{display:grid;grid-template-columns:1fr 130px 96px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--bd)}
.lim:first-child{border-top:0}
.lim-n{font-size:13px;color:var(--ink);line-height:1.3}
.lim-n s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.lim-t{height:6px;border-radius:3px;background:#efedf3;overflow:hidden}
.lim-t i{display:block;height:100%;border-radius:3px;background:var(--purple-mid)}
.lim-t i.hot{background:var(--clay)}
.lim-v{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right}
.log{display:grid;grid-template-columns:70px 108px 1fr auto;gap:14px;align-items:baseline;padding:10px 0;
  border-top:1px solid var(--bd);font-size:12.5px}
.log:first-child{border-top:0}
.log-t{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.log-c{font-family:var(--sans);font-size:11px;letter-spacing:.01em;color:var(--ink-3)}
.log-m{color:var(--ink-2);line-height:1.5}
.log-s{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.01em;color:var(--purple-deep);
  background:var(--purple-soft);border-radius:999px;padding:3px 9px}
.log-s.warn{color:var(--clay);background:var(--clay-soft)}
.log.w .log-m{color:var(--ink)}

/* dashboard grid */
.dash{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
.dash>*{min-width:0}
.dash>.col{display:grid;gap:16px;align-content:start}
.dash>.span{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;grid-column:1/-1;
  background:color-mix(in oklab,var(--bd) 62%,transparent);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-bd);border-radius:var(--r-card);
  box-shadow:var(--sh-1),var(--glass-hi)}
.kpi{min-width:0;background:var(--glass);padding:14px 16px 15px}
.kpi:first-child{border-radius:calc(var(--r-card) - 1px) 0 0 calc(var(--r-card) - 1px)}
.kpi:last-child{border-radius:0 calc(var(--r-card) - 1px) calc(var(--r-card) - 1px) 0}
@media (max-width:1400px){
  .kpi:first-child{border-radius:calc(var(--r-card) - 1px) 0 0 0}
  .kpi:nth-child(2){border-radius:0 calc(var(--r-card) - 1px) 0 0}
  .kpi:nth-child(3){border-radius:0 0 0 calc(var(--r-card) - 1px)}
  .kpi:last-child{border-radius:0 0 calc(var(--r-card) - 1px) 0}
}
@media (max-width:1000px){
  .kpis{grid-template-columns:minmax(0,1fr)}
  .kpi:nth-child(n){border-radius:0}
  .kpi:first-child{border-radius:calc(var(--r-card) - 1px) calc(var(--r-card) - 1px) 0 0}
  .kpi:last-child{border-radius:0 0 calc(var(--r-card) - 1px) calc(var(--r-card) - 1px)}
}
.kpi.lead{background:color-mix(in oklab,var(--purple-soft-2) 78%,transparent)}
.kpi-k{font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--ink-3)}
.kpi-r{display:flex;align-items:baseline;gap:9px;margin-top:9px}
.kpi-v{font-family:var(--sans);font-size:31px;font-weight:600;color:var(--ink);line-height:1;
  letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.kpi.lead .kpi-v{color:var(--purple-deep)}
.kpi-v s{text-decoration:none;font-size:13px;font-weight:500;color:var(--ink-3);margin-left:3px;letter-spacing:0}
.kpi-d{font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--purple-deep);font-variant-numeric:tabular-nums}
.kpi-d.state,.kpi-d.flat{color:var(--ink-4)}
.spk{width:100%;height:22px;display:block;margin-top:11px;overflow:visible}
.kpi-n{font-size:12px;color:var(--ink-3);margin-top:9px;line-height:1.45}
.tbig-v{font-family:var(--sans);font-size:40px;font-weight:600;color:var(--purple-deep);line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tbig-v s{text-decoration:none;font-size:14px;font-weight:500;color:var(--ink-3);margin-left:5px;letter-spacing:0}
.tbig-n{font-size:12px;color:var(--ink-3);line-height:1.55;margin-top:9px}

/* usage chart */
.uhead{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.uv{font-family:var(--sans);font-size:36px;font-weight:600;color:var(--ink);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.uc{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.uplot{position:relative;height:170px;margin:0 0 0 52px;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.ucht{position:absolute;inset:0;width:100%;height:100%;display:block}
.uy{position:absolute;right:100%;transform:translateY(-50%);padding-right:9px;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-4);white-space:nowrap}
.uband{position:absolute;left:0;right:0;background:rgba(24,20,40,.045);pointer-events:none}
.urule{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--bd-2);pointer-events:none}
.urule.cap{border-top-color:var(--clay)}
.urule b{position:absolute;right:0;top:-9px;background:var(--panel-2);padding:0 0 0 8px;
  font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--clay);white-space:nowrap}
.urule.floor b{left:0;right:auto;color:var(--ink-4);padding:0 8px 0 0}
.ucl{display:flex;justify-content:space-between;margin:9px 0 0 52px;font-family:var(--mono);font-size:9px;color:var(--ink-4)}
.ucl .pj{color:var(--purple-mid)}
.uband-t{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:var(--sans);
  font-size:10.5px;font-weight:500;letter-spacing:.01em;color:var(--purple-deep);opacity:.8}

/* tooltips */
.ttw{display:inline-flex;align-items:center;gap:7px}
.tt{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;flex:none;
  border:1px solid var(--bd-2);background:var(--panel-2);color:var(--ink-4);cursor:help;
  font-family:var(--sans);font-size:9.5px;font-weight:600;font-style:normal;letter-spacing:0;line-height:1}
.tt:hover,.tt:focus-visible{border-color:var(--purple);color:var(--purple-deep);outline:none}
.tt em{display:none}
#tipf{position:fixed;top:0;left:0;max-width:262px;padding:12px 14px;border-radius:12px;
  background:#211c30;color:#efedf5;font-family:var(--sans);font-style:normal;font-size:12px;font-weight:400;
  line-height:1.5;letter-spacing:0;text-align:left;text-wrap:pretty;box-shadow:var(--sh-3);
  opacity:0;visibility:hidden;transform:translateY(4px);pointer-events:none;z-index:200;
  transition:opacity .16s,transform .16s,visibility .16s}
#tipf.on{opacity:1;visibility:visible;transform:translateY(0)}

/* live activity */
.strm{display:flex;align-items:center;gap:7px}
.strm i{width:6px;height:6px;border-radius:999px;background:var(--purple);animation:blip 1.7s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:.3}50%{opacity:1}}
.feed{display:grid}
.fe{display:grid;grid-template-columns:14px minmax(0,1fr);gap:11px;padding:11px 0;
  border-top:1px solid var(--bd);animation:fein .42s ease}
.fe:first-child{border-top:0;padding-top:2px}
.fe-d{width:7px;height:7px;border-radius:999px;background:var(--purple-soft);justify-self:center;margin-top:5px;
  box-shadow:inset 0 0 0 1px var(--bd-purple)}
.fe:first-child .fe-d{background:var(--purple-deep);box-shadow:0 0 0 3.5px var(--purple-soft)}
.fe-m{font-size:12.5px;color:var(--ink-2);line-height:1.45;text-wrap:pretty}
.fe-m b{color:var(--ink);font-weight:600}
.fe-t{font-size:11px;color:var(--ink-4);margin-top:3px;font-variant-numeric:tabular-nums}
@keyframes fein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* tonight so far */
.tn-c{font-size:13px;color:var(--ink-2);line-height:1.6;text-wrap:pretty}
.tn-c b{color:var(--ink);font-weight:600}
.tn-s{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:17px}
.tn-v{font-size:25px;font-weight:600;letter-spacing:-.025em;color:var(--ink);line-height:1;
  font-variant-numeric:tabular-nums}
.tn-v.z{color:var(--purple-deep)}
.tn-k{font-size:11px;color:var(--ink-4);margin-top:6px}

/* outcome ask */
.ask{border:1px dashed var(--bd-2);border-radius:var(--r-ctl);padding:13px 14px;margin-top:2px}
.ask-t{font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.4}
.ask-s{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.ask-b{margin-top:11px;font-size:12px;font-weight:500;color:var(--purple-deep);border:1px solid var(--bd-purple);
  background:var(--purple-soft-2);border-radius:999px;padding:6px 13px;transition:background .14s}
.ask-b:hover{background:var(--purple-soft)}
.ask-b:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* legend */
.chart-h{display:flex;align-items:center;gap:16px}
.key{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;letter-spacing:0;color:var(--ink-4)}
.key i{width:9px;height:9px;border-radius:3px;display:block}

/* updates feed */
.q{display:grid;gap:2px}
.qg{display:flex;align-items:center;gap:9px;padding:16px 12px 8px}
.qg+.q{margin-bottom:2px}
.qg.later{border-top:1px solid var(--bd);margin-top:10px;padding-top:15px}
.qg-t{font-size:11.5px;letter-spacing:.01em;color:var(--ink-3);font-weight:600}
.qg-c{font-family:var(--mono);font-size:10px;color:var(--ink-4);background:var(--bd);
  border-radius:999px;padding:2px 7px}
.qi{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:14px;align-items:start;width:100%;
  text-align:left;padding:12px;border-radius:var(--r-ctl);
  transition:background .15s,opacity .2s,transform .2s,box-shadow .15s}
.qi:hover{background:#f5f3f9}
.qi:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}
.qi.sel{background:var(--purple-soft-2);box-shadow:inset 0 0 0 1px var(--bd-purple)}
.qi.gone{opacity:0;transform:translateX(14px)}
.qi-dot{width:7px;height:7px;border-radius:999px;background:var(--bd-purple);justify-self:center;margin-top:6px}
.qi.hot .qi-dot{background:var(--purple-deep);box-shadow:0 0 0 3.5px var(--purple-soft)}
.qi-m{min-width:0;max-width:66ch}
.qi-t{display:block;font-size:13.5px;color:var(--ink);line-height:1.4;font-weight:500}
.qi-w{display:block;font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.qi-a{font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.02em}
.qi.hot .qi-a{color:var(--purple-deep)}
.qi-w b{color:var(--ink-4);font-weight:400;font-family:var(--sans);font-size:11px;letter-spacing:.01em}
.qi-do{font-size:12px;color:var(--purple-deep);white-space:nowrap;font-weight:500;align-self:center;
  min-width:136px;text-align:center;padding:7px 13px;border-radius:999px;
  border:1px solid transparent;transition:background .15s,border-color .15s}
.qi:hover .qi-do{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-color:var(--bd-purple);box-shadow:var(--glass-hi)}
.qi-do:hover{background:var(--purple-soft)}
.qi-do:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.empty{text-align:center;padding:34px 20px}
.empty-m{width:40px;height:40px;border-radius:12px;background:var(--purple-soft);border:1px solid var(--bd-purple);
  display:grid;place-items:center;margin:0 auto 13px;color:var(--purple-deep);font-family:var(--sans);font-size:17px}
.empty-t{font-family:var(--serif);font-size:22px;color:var(--ink);line-height:1.2}
.empty-s{font-size:12.5px;color:var(--ink-3);margin-top:5px;line-height:1.55;max-width:46ch;margin-left:auto;margin-right:auto}

/* generic panel */
.pl{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-bd);border-radius:var(--r-card);margin-bottom:16px;
  box-shadow:var(--sh-1),var(--glass-hi)}
.dash>.pl,.dash>.col>.pl{margin-bottom:0}
.pl-b.flush{padding:0}
.pl-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--bd)}
.pl-t{font-family:var(--serif);font-size:19px;color:var(--ink);line-height:1.2}
.pl-b{padding:16px}
.wrap{max-width:880px;margin:0 auto}

/* time back hero */
.cum{padding:12px 16px;border-top:1px solid var(--bd);font-size:12px;color:var(--ink-3);background:var(--panel-2)}
.cum b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:11.5px}

/* ownership funnel */
.zone{border:1px solid var(--bd);border-radius:var(--r-ctl);padding:13px 14px;background:var(--panel)}
.zone.ours{background:var(--purple-soft-2);border-color:var(--bd-purple)}
.zone-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.zone-n{font-size:13px;color:var(--ink);font-weight:600}
.zone-n s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:2px}
.tagw{font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  border-radius:999px;padding:3px 9px;background:var(--chrome);color:var(--ink-3);border:1px solid var(--bd-2)}
.tagw.r{background:var(--purple);color:#fff;border-color:var(--purple)}
.fr{display:grid;grid-template-columns:140px 1fr 64px 48px;gap:10px;align-items:center;padding:4px 0}
.fr-n{font-size:12px;color:var(--ink-2)}
.fr-t{height:18px;border-radius:6px;background:#eeecf2;overflow:hidden}
.fr-t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--purple-mid),var(--purple-deep))}
.fr-v{font-family:var(--mono);font-size:11px;color:var(--ink);text-align:right}
.fr-p{font-family:var(--mono);font-size:10px;color:var(--ink-4);text-align:right}
.fr-y{font-family:var(--sans);font-size:11px;letter-spacing:.01em;color:var(--ink-4);
  border:1px dashed var(--bd-2);border-radius:999px;padding:3px 8px;text-align:center;grid-column:2/5}
.hand{display:flex;align-items:center;gap:10px;padding:9px 0}
.hand i{flex:1;height:1px;background:var(--bd-2)}
.hand span{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.02em;color:var(--ink-4)}
.zone-f{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin-top:9px;padding-top:9px;border-top:1px dashed var(--bd-2)}

/* flow canvas */
.flow{display:grid;justify-items:center;max-width:560px;margin:0 auto}
.row{width:100%;display:flex;justify-content:center}
.split{display:grid;gap:12px;width:100%}
.stack{width:100%}
.n{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-bd);border-radius:var(--r-card);text-align:left;width:100%;
  box-shadow:var(--sh-1),var(--glass-hi);transition:border-color .15s,box-shadow .15s,transform .1s}
.n:hover{border-color:var(--bd-purple);box-shadow:var(--sh-2)}
.n:active{transform:translateY(1px)}
.n:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.n-h{display:flex;align-items:flex-start;gap:12px;padding:13px 14px}
.n-i{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--purple-soft);color:var(--purple-deep);font-family:var(--sans);font-size:14px;margin-top:1px;
  transition:background .15s,color .15s}
.n-i svg{width:17px;height:17px;display:block}
.n-w{flex:1;min-width:0}
.n-t{font-size:14px;color:var(--ink);line-height:1.3;font-weight:600;letter-spacing:-.005em}
.n-s{font-size:12px;color:var(--ink-3);line-height:1.45;margin-top:3px}
.n-b{padding:0 14px 12px}
.n-m{display:flex;flex-wrap:wrap;gap:16px;padding:10px 14px;border-top:1px solid var(--bd);
  background:var(--purple-soft-2);border-radius:0 0 13px 13px}
.n-mi{display:flex;align-items:baseline;gap:6px}
.n-mv{font-family:var(--mono);font-size:11.5px;color:var(--purple-deep)}
.n-mk{font-size:11px;color:var(--ink-3)}
.n.sel{border-color:var(--purple);box-shadow:0 0 0 3px color-mix(in oklab,var(--purple) 16%,transparent)}
.n.firing{border-color:var(--purple);box-shadow:0 0 0 3px color-mix(in oklab,var(--purple) 14%,transparent)}
.n.firing .n-i{background:var(--purple);color:#fff}
.n.human .n-i{background:var(--clay-soft);color:var(--clay)}
.n.human.firing{border-color:var(--clay)}
.n.human.firing .n-i{background:var(--clay);color:#fff}
.n.human .n-m{background:#fbf8f4}
.n.human .n-mv{color:var(--clay)}
.n.off{background:var(--panel);border-style:dashed}
.n.off .n-i{background:var(--chrome-2);color:var(--ink-4)}
.n.off .n-m{background:var(--chrome)}
.n.off .n-mv{color:var(--ink-3)}
.n.off.firing{border-color:var(--ink-3)}
.n.gate{opacity:.66}
.n.out{background:var(--purple-soft);border-color:var(--bd-purple);cursor:pointer;box-shadow:none}
.n.out:hover{background:color-mix(in oklab,var(--purple) 16%,#fff);border-color:var(--purple)}
.n-go{font-family:var(--sans);font-size:14px;color:var(--purple-deep);transition:transform .15s}
.n.out:hover .n-go{transform:translateX(3px)}
.n.out .n-t{color:var(--purple-deep);text-align:center}
.n.out .n-h{justify-content:center;align-items:center;gap:9px;padding:12px 14px}
.rule{display:flex;flex-wrap:wrap;gap:6px}
.rule span{font-size:11.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--bd);
  border-radius:999px;padding:4px 10px;transition:background .15s,border-color .15s}
.rule span.dim{color:var(--ink-4);background:#f5f4f8;border-style:dashed}
.rule span.lit{background:var(--purple-soft);border-color:var(--bd-purple);color:var(--purple-deep)}
.c{display:grid;justify-items:center;width:100%;position:relative}
.c-l{width:1.5px;height:14px;background:var(--line);border-radius:2px}
.c-p{font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;background:var(--panel-2);
  border:1px solid var(--bd-2);color:var(--ink-3);border-radius:999px;padding:3px 10px;margin:2px 0;box-shadow:var(--sh-1)}
.c-p.yes{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 4px 12px -6px color-mix(in oklab,var(--purple) 70%,transparent)}
.c-p.human{background:var(--clay);border-color:var(--clay);color:#fff}
.pw{display:flex;justify-content:center;margin-bottom:7px}
.spark{position:absolute;left:50%;margin-left:-2.5px;width:5px;height:9px;border-radius:3px;background:var(--purple);
  box-shadow:0 0 8px 2px color-mix(in oklab,var(--purple) 45%,transparent);animation:travel .6s linear forwards;
  pointer-events:none;z-index:2}
@keyframes travel{0%{top:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}
.n-mv.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}28%{transform:scale(1.13)}100%{transform:scale(1)}}

/* lanes */
.lanes{display:grid;gap:9px}
.lane{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--glass);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-bd);border-radius:var(--r-card);padding:13px 14px;
  box-shadow:var(--sh-1),var(--glass-hi)}
.lane.off{background:var(--panel);border-style:dashed}

function seq(items){

    if(it.el==='p'){pend=it;return;}

      var cid='cn'+(CID++);WALK.push({k:'conn',id:cid});
      out+='<div class="c" id="'+cid+'"><div class="c-l"></div>'+
        (pend?'<div class="c-p '+(pend.k||'')+'">'+pend.t+'</div>':'')+'<div class="c-l"></div></div>';
    }
    pend=null;first=false;
    if(it.el==='s'){
      var opts=[],cols='';
      it.items.forEach(function(col){
        var cid2='cn'+(CID++),mk=nodeHTML(col[1]);
        opts.push({c:cid2,n:col[1]._id,w:(col[0].w===undefined?1:col[0].w)});
        cols+='<div><div class="pw c" id="'+cid2+'"><div class="c-p '+(col[0].k||'')+'">'+col[0].t+'</div></div>'+
          '<div class="stack">'+mk+'</div></div>';});
      WALK.push({k:'split',opts:opts});
      out+='<div class="split" style="grid-template-columns:repeat('+it.items.length+',1fr)">'+cols+'</div>';
    } else {

function projMonth(cum){
  var days=cum.length*7;
  return Math.round(cum[cum.length-1]/days*31);
}
function usageChart(v){
  var cap=ALLOWANCE.leads, floor=ALLOWANCE.bandFrom;
  var n=v.cum.length, last=v.cum[n-1];
  var proj=projMonth(v.cum);
  var top=Math.max(cap,proj)*1.12;
  var y=function(val){return (100-(val/top)*100);};
  var x=function(i){return (i/n)*82;};

  var pts=v.cum.map(function(val,i){return x(i+1).toFixed(1)+','+y(val).toFixed(1);});
  pts.unshift('0,'+y(0).toFixed(1));
  var line=pts.join(' ');
  var area=line+' '+x(n).toFixed(1)+',100 0,100';

  var ticks=[0,Math.round(cap/2/100)*100,cap,Math.round(top/100)*100];
  var axis=ticks.map(function(t){
    return '<span class="uy" style="top:'+y(t).toFixed(1)+'%">'+fmt(t)+'</span>';}).join('');

  return '<div class="uplot">'+axis+
    '<div class="uband" style="top:'+y(cap).toFixed(1)+'%;height:'+(y(floor)-y(cap)).toFixed(1)+'%">'+
      '<span class="uband-t">'+ALLOWANCE.plan+' band</span></div>'+
    '<div class="urule cap" style="top:'+y(cap).toFixed(1)+'%"><b>'+fmt(cap)+' allowance</b></div>'+
    '<div class="urule floor" style="top:'+y(floor).toFixed(1)+'%"><b>'+fmt(floor)+' band starts</b></div>'+
    '<svg class="ucht" viewBox="0 0 100 100" preserveAspectRatio="none">'+
      '<polygon points="'+area+'" fill="color-mix(in oklab, var(--purple) 18%, transparent)"/>'+
      '<polyline points="'+line+'" fill="none" stroke="var(--purple-deep)" stroke-width="1.8" '+
        'vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'+
      '<line x1="'+x(n).toFixed(1)+'" y1="'+y(last).toFixed(1)+'" x2="100" y2="'+y(proj).toFixed(1)+'" '+
        'stroke="var(--purple-mid)" stroke-width="1.6" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>'+
    '</svg></div>'+
    '<div class="ucl"><span>'+v.cumL.join('</span><span>')+'</span><span class="pj">month end</span></div>';
}

/* generic modal shell */
function openModal(o){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="md" role="dialog" aria-modal="true">'+
    '<div class="md-h"><div><div class="md-t">'+o.title+'</div>'+
    '<div class="md-s">'+o.sub+'</div></div>'+
    '<button class="md-x" type="button" data-x="1" aria-label="Close">✕</button></div>'+
    '<div class="md-b" data-body="1">'+o.body+'</div>'+
    '<div class="md-f" data-foot="1">'+o.foot+'</div></div>';
  document.body.appendChild(ov);
  var onKey=function(e){if(e.key==='Escape')close();};
  function close(){ov.remove();document.removeEventListener('keydown',onKey);if(o.onClose)o.onClose();}
  document.addEventListener('keydown',onKey);
  ov.onclick=function(e){if(e.target===ov)close();};
  ov.querySelector('[data-x]').onclick=close;
  var api={ov:ov,close:close,
    body:ov.querySelector('[data-body]'),foot:ov.querySelector('[data-foot]'),
    g:function(id){return ov.querySelector('#'+id);},
    done:function(t,s){
      api.body.innerHTML='<div class="done"><div class="done-m">✓</div>'+
        '<div class="done-t">'+t+'</div><div class="done-s">'+s+'</div></div>';
      api.foot.innerHTML='<button class="btn" type="button" data-done="1">Close</button>';
      api.foot.querySelector('[data-done]').onclick=close;
    }};
  if(o.wire)o.wire(api);
  return api;
}

  tbT.textContent=v.name;

}
(function(){
  var saved=null;try{saved=localStorage.getItem('rb.insp')}catch(_){}
  setInsp(saved===null ? window.innerWidth>1040 : saved==='1');
})();
IPIN.onclick=function(){setInsp(SHELL.classList.contains('shut'))};
document.addEventListener('keydown',function(e){
  if(e.key==='.'&&(e.metaKey||e.ctrlKey)){e.preventDefault();IPIN.click();}
});

var RAILBTN=document.getElementById('railBtn'), RAILSCRIM=document.getElementById('railScrim');
function setRail(open){
  SHELL.classList.toggle('rail-open',open);
  RAILBTN.setAttribute('aria-expanded',open?'true':'false');
  RAILBTN.title=open?'Close menu':'Open menu';
}
RAILBTN.onclick=function(){setRail(!SHELL.classList.contains('rail-open'))};
RAILSCRIM.onclick=function(){setRail(false)};
document.addEventListener('keydown',function(e){if(e.key==='Escape') setRail(false);});
go('operation');

</script>
</body>
</html>
