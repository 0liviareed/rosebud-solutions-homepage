<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosebud Solutions · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* v9 console tokens — SHARED CONTRACT (demo :root and app .theme carry identical values).
     Legacy names (demo/app) are kept as aliases so existing rules restyle without renaming. */
  --ink:#1c1a2e; --ink-2:#4f4c66; --ink-3:#8a889b; --ink-4:#8a889b;
  --line:rgba(23,19,31,.08); --bd:rgba(23,19,31,.08); --bd-2:color-mix(in oklab, var(--ink) 14%, #fff);
  --bg:#EDEBF3; --canvas:#EDEBF3; --desk:#EDEBF3;
  --panel-2:#fff;                      /* card surface (legacy name; v9 "panel") */
  --panel:#F5F3F9; --chrome:#F5F3F9;   /* soft inset surface (v9 "panel-2") */
  --lilac:#EAE6F3; --chrome-2:#EAE6F3;
  --violet:#5b4bb6; --purple:#5b4bb6;
  --purple-deep:color-mix(in oklab, var(--violet) 76%, #14102a);
  --violet-soft:#efecfa; --purple-soft:#efecfa; --purple-soft-2:#f6f4fb;
  --violet-2:#8b7fd1; --purple-mid:#8b7fd1;
  --violet-3:#d8d2f1; --bd-purple:#d8d2f1;
  --green:#1f9d78; --rose:#c5443e; --pink:#b86aa8; --amber:#b88a2e; --blue:#2d67d3;
  --clay:#b88a2e; --clay-soft:#F5F1EA;
  --shadow:0 1px 2px rgba(23,19,31,.04), 0 12px 32px -12px rgba(23,19,31,.14), inset 0 1px 0 rgba(255,255,255,.9);
  --sh-1:0 1px 2px rgba(23,19,31,.04);
  --sh-2:0 1px 2px rgba(23,19,31,.04), 0 12px 32px -12px rgba(23,19,31,.14);
  --sh-3:0 26px 70px -24px rgba(23,19,31,.42), 0 2px 6px rgba(23,19,31,.08);
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.55); --glass-bd:var(--line);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.9); --blur:blur(24px) saturate(1.3);
  --rail:248px; --rail-min:64px; --insp:336px; --r-card:14px; --r-ctl:10px;
  --ground:radial-gradient(1100px 500px at 15% -10%, rgba(139,125,216,.14), transparent 60%), var(--bg);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Inter',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink-2);
  background:var(--panel-2);height:100vh;overflow:hidden}
a{color:var(--violet);text-decoration:none;font-weight:500}
a:hover{color:var(--purple-deep)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{height:100%;display:flex;flex-direction:column;background:var(--panel-2);overflow:hidden}
.lbl{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-4)}

/* rail brand + footer (v9 contract — identical class names on app.rosebud.global) */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);
  margin:0 8px 22px;position:relative;flex:none}
.brand .orb{width:26px;height:26px;border-radius:50%;flex:none;display:block}
.brand .tg{position:absolute;right:-2px;top:-3px;width:30px;height:30px;border:0;background:transparent;border-radius:8px;
  color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.brand .tg:hover{background:rgba(23,19,31,.05);color:var(--ink)}
.brand .tg:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.brand .tg svg{width:16px;height:16px}
.nav .foot{flex:none;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.nav .user{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:6px;border-radius:10px;font-size:13px;
  width:100%;text-align:left;color:var(--ink);font-weight:500;transition:background .12s}
.nav .user:hover{background:rgba(23,19,31,.04)}
.nav .user:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
.nav .user .av{width:28px;height:28px;font-size:11px}
.nav .user small{display:block;color:var(--ink-3);font-size:11px;font-weight:400}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#F3F0FB,#E1DBF3);
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px var(--line);color:var(--violet);font-weight:600;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:none}
.logo-p{width:52px;height:52px;border-radius:13px;background:var(--purple-soft);border:1px solid var(--bd-purple);
  display:grid;place-items:center;font-family:var(--serif);font-size:24px;color:var(--purple-deep);flex:none;overflow:hidden}
img.logo-p{object-fit:cover;background:#fff;padding:3px}
.logo-r{display:flex;align-items:center;gap:14px}
.logo-a{display:flex;gap:8px;margin-top:9px}
.greet{margin-bottom:2px}
.greet-t{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1.1;letter-spacing:-.005em}
.greet-s{font-size:13px;color:var(--ink-3);line-height:1.55;margin-top:7px;max-width:70ch}
.dot{width:8px;height:8px;border-radius:50%;background:var(--violet);flex:none;display:inline-block;box-shadow:0 0 0 3px var(--violet-3)}

/* system status strip (dashboard) */
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(134px,1fr));gap:1px;background:transparent}
.si{background:var(--glass-2);padding:13px 15px;min-width:0;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 0 0 .5px var(--bd)}
.si-k{color:var(--ink-4);font-size:11px;font-family:var(--sans);font-weight:500;letter-spacing:.01em}
.si-v{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:15px;font-weight:600;
  color:var(--ink);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.si-v.p{color:var(--purple-deep)}
.bar{height:6px;border-radius:99px;background:var(--lilac);box-shadow:inset 0 1px 2px rgba(23,19,31,.08);overflow:hidden;margin:10px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet-2),var(--violet));border-radius:99px}
body[data-sys="off"] .sys-panel{display:none}

/* shell */
.shell{display:grid;grid-template-columns:var(--rail) 1fr var(--insp);grid-template-rows:100%;
  flex:1;min-height:0;overflow:hidden;transition:grid-template-columns .22s ease}
.shell.shut{grid-template-columns:var(--rail) 1fr 0}
.shell.shut .insp{opacity:0;pointer-events:none}
.shell.min{--rail:var(--rail-min)}
.shell.noinsp{grid-template-columns:var(--rail) 1fr 0}
.shell.noinsp .insp{opacity:0;pointer-events:none}
.shell.noinsp .ipin{display:none}
.mid{container-type:inline-size}
.ipin{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;border-radius:var(--r-ctl);
  border:1px solid var(--bd-2);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  font-family:var(--sans);font-size:12px;
  letter-spacing:0;color:var(--ink-3);flex:none;box-shadow:var(--glass-hi);
  transition:background .14s,color .14s,border-color .14s}
.ipin:hover{color:var(--ink);border-color:var(--line);background:var(--chrome)}
.ipin:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.ipin i{width:13px;height:11px;border-radius:2.5px;border:1.4px solid currentColor;position:relative;flex:none;font-style:normal}
.ipin i::after{content:'';position:absolute;top:0;bottom:0;right:0;width:4.5px;background:currentColor;
  border-radius:0 1px 1px 0}
.shell.shut~* .ipin i::after,.ipin.off i::after{background:none}
.ipin.off{color:var(--ink-4)}

/* mobile rail drawer — .railBtn only shows under the mobile breakpoint */
.railBtn{display:none;align-items:center;justify-content:center;width:34px;height:34px;flex:none;
  border-radius:var(--r-ctl);border:1px solid var(--bd-2);background:var(--glass);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--ink-3);
  box-shadow:var(--glass-hi);transition:background .14s,color .14s,border-color .14s}
.railBtn:hover{color:var(--ink);border-color:var(--line);background:var(--chrome)}
.railBtn:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.railBtn svg{width:17px;height:17px;display:block}
.rail-scrim{display:none;position:fixed;inset:0;z-index:110;background:rgba(23,19,31,.4);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.insp-scrim{display:none;position:fixed;inset:0;z-index:110;background:rgba(23,19,31,.4);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

/* nav (v9 contract) */
.nav{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overflow-x:hidden;
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-right:1px solid var(--line);padding:18px 12px 14px}
#navHost{display:contents}
.nav .sec{flex:none;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:0 10px;margin:16px 0 6px;border:0}
.nav .it{display:flex;flex:none;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--ink);
  font-weight:500;font-size:14px;width:100%;text-align:left;transition:background .12s}
.nav .it:hover{background:rgba(23,19,31,.04)}
.nav .it:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
.nav .it.on{background:var(--violet-soft);color:var(--violet);box-shadow:inset 0 0 0 1px rgba(91,75,182,.14)}
.nav .it.off{color:var(--ink-3)}
.nav .it svg{width:16px;height:16px;flex:none;color:var(--ink-2)}
.nav .it.on svg{color:var(--violet)}
.nav .it.off svg{color:var(--ink-3)}
.nav .it .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .it .bd{margin-left:auto;font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px;background:var(--lilac);
  border:1px solid var(--line);color:var(--ink-2)}
.nav .it .bd:empty{display:none}
.nav .it.on .bd{background:var(--violet);border-color:var(--violet);color:#fff}
.nav .grow{flex:1;min-height:12px}
@media (min-width:781px){
  .nav.min{padding-left:10px;padding-right:10px}
  .nav.min .lb,.nav.min .sec,.nav.min .bd,.nav.min .user small{display:none}
  .nav.min .brand{justify-content:center;margin-left:0;margin-right:0;margin-top:34px}
  .nav.min .tg{right:auto;left:50%;transform:translateX(-50%);top:-40px}
  .nav.min .it{justify-content:center;padding:0;width:44px;margin:0 auto}
  .nav.min .user{justify-content:center;padding:8px 0}
  .nav.min .sec+.it{border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:10px;padding-top:6px;height:40px}
}
/* centre */
.mid{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel-2)}
.tb{display:flex;align-items:center;gap:12px;padding:0 18px;height:54px;background:var(--panel-2);
  border-bottom:1px solid var(--line);flex:none;z-index:1}
.tb-t{font-family:var(--serif);font-size:21px;color:var(--ink);line-height:1;letter-spacing:.005em}
.tb-m{font-family:var(--sans);font-size:12.5px;letter-spacing:0;color:var(--ink-4);
  min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.seg,.range{display:flex;gap:8px}
.seg button,.range button{border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:999px;padding:9px 16px;
  font:inherit;font-weight:500;font-size:14px;color:var(--ink);cursor:pointer;transition:background .14s,color .14s,box-shadow .14s}
.seg button:hover,.range button:hover{background:#fff}
.seg button.on,.range button.on{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:0 6px 18px -6px rgba(91,75,182,.55)}
.seg button:focus-visible,.range button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.seg button{padding:6px 13px;font-size:12.5px}
.range{justify-content:flex-end;margin:30px 0 26px}
.scroll{flex:1;min-height:0;min-width:0;width:100%;overflow-y:auto;overflow-x:hidden;padding:var(--pad,24px);
  background:var(--ground);box-shadow:inset 0 1px 3px rgba(23,19,31,.05)}
.scroll.grid{background:radial-gradient(circle at 1px 1px,color-mix(in oklab,var(--ink) 12%,transparent) 1.1px,transparent 0) 0 0/20px 20px,var(--ground)}
.scroll.wash{background:var(--ground)}
/* v9 dashboard */

  /* header row */
 .dashv9 .head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
 .dashv9 .head h1{font-family:"Cormorant Garamond",serif;font-size:40px;font-weight:500;letter-spacing:-.01em;margin:0 0 6px;line-height:1.1}
 .dashv9 .head p{margin:0;color:var(--ink-2);font-size:14px}
 .dashv9 .chips{display:flex;gap:12px}
 .dashv9 .chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255, .dashv9 .7);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:11px 16px;font-weight:500;font-size:14px}
 .dashv9 .dot{width:8px;height:8px;border-radius:50%;background:var(--violet);display:inline-block;box-shadow:0 0 0 3px var(--violet-3)}


 .dashv9 .panel{background:linear-gradient(180deg,#fff 0%,#FCFBFE 100%);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

  /* stat row: 27 / 43 / 30 like the reference */
 .dashv9 .stats{display:grid;grid-template-columns:27fr 43fr 28fr;gap:14px}

 .dashv9 .actions{padding:20px 18px 14px}
 .dashv9 .actions .top{display:flex;justify-content:space-between;align-items:flex-start}
 .dashv9 .actions .ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(180deg,#F3F0FB,#E6E1F5);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(23,19,31, .dashv9 .05);color:var(--violet);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;margin-right:14px}
 .dashv9 .actions .l{display:flex}
 .dashv9 .actions .t{font-weight:600;font-size:16px}
 .dashv9 .actions .s{color:var(--ink-3);font-size:13px;margin-top:2px}
 .dashv9 .actions .n{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1;text-align:right}
 .dashv9 .actions .due{color:var(--violet);font-size:12px;margin-top:8px;text-align:right;display:flex;align-items:center;gap:6px;justify-content:flex-end}
 .dashv9 .actions .due::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--violet)}
 .dashv9 .actions .sub{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:18px;padding-top:14px;font-size:14px;color:var(--ink-2)}
 .dashv9 .actions .sub span{display:flex;align-items:center;gap:8px}

 .dashv9 .leads{display:grid;grid-template-columns:repeat(3,1fr)}
 .dashv9 .leads>div{padding:20px 22px;border-right:1px solid var(--line)}
 .dashv9 .leads>div:first-child{border-radius:14px 0 0 14px}
 .dashv9 .leads>div:last-child{border-right:0}
 .dashv9 .leads .l{color:var(--ink-3);font-size:13px}
 .dashv9 .leads .n{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:8px 0 8px}
 .dashv9 .leads .m{color:var(--ink-3);font-size:12px;line-height:1.45}

 .dashv9 .plan{padding:20px 22px;display:flex;flex-direction:column}
 .dashv9 .plan .top{display:flex;justify-content:space-between;color:var(--ink-3);font-size:13px}
 .dashv9 .plan .top a{color:var(--rose);font-size:13px}
 .dashv9 .plan .n{font-size:34px;font-weight:600;letter-spacing:-.02em;margin:10px 0 2px}
 .dashv9 .plan .n small{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:4px}
 .dashv9 .bar{height:6px;border-radius:99px;background:var(--lilac);box-shadow:inset 0 1px 2px rgba(23,19,31, .dashv9 .08);overflow:hidden;margin:10px 0 10px}
 .dashv9 .bar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--violet-2),var(--violet));border-radius:99px}
 .dashv9 .plan .m{color:var(--ink-3);font-size:12px;margin-top:auto}

  /* chart, full width */
 .dashv9 .chart{margin-top:30px;padding:26px 28px 22px}
 .dashv9 .chart .hd{display:flex;justify-content:space-between;align-items:flex-start}
 .dashv9 .chart h2{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:500;margin:0}
 .dashv9 .chart .hd p{margin:6px 0 0;color:var(--ink-2);font-size:14px}
 .dashv9 .legend{display:flex;gap:22px;font-size:14px;color:var(--ink);padding-top:4px}
 .dashv9 .legend span{display:flex;align-items:center;gap:8px}
 .dashv9 .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
 .dashv9 .chart svg{width:100%;height:auto;display:block;margin-top:34px}

  /* bottom panels */
 .dashv9 .two{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:30px}
 .dashv9 .list .hd{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 14px}
 .dashv9 .list .hd .l{display:flex;align-items:center}
 .dashv9 .list .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:14px}
 .dashv9 .ic.a{background:linear-gradient(180deg,#F3F0FB,#E6E1F5);color:var(--violet);box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(23,19,31, .dashv9 .05)} .ic.b{background:linear-gradient(180deg,#F5F1EA,#ECE6DA);color:#6b5a2e;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(23,19,31, .dashv9 .05)}
 .dashv9 .list h3{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:24px;margin:0}
 .dashv9 .list .hd p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
 .dashv9 .item{display:flex;gap:12px;padding:13px 20px;border-top:1px solid var(--line);align-items:flex-start;transition:background .15s}
 .dashv9 .item:hover{background:var(--panel)}
 .dashv9 .list .hd{background:var(--panel);border-radius:14px 14px 0 0}
 .dashv9 .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(180deg,#F3F0FB,#E1DBF3);box-shadow:inset 0 1px 0 #fff,0 0 0 1px var(--line);color:var(--violet);font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
 .dashv9 .body{flex:1;min-width:0}
 .dashv9 .who{font-weight:500;color:var(--violet)}
 .dashv9 .who.plain{color:var(--ink)}
 .dashv9 .what{color:var(--ink-2);font-size:13px}
 .dashv9 .snip{color:var(--ink);font-size:13px;margin-top:2px}
 .dashv9 .when{color:var(--ink-3);font-size:12px;white-space:nowrap}
 .dashv9 .tier{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--lilac);border:1px solid var(--line);color:var(--violet);font-weight:500;white-space:nowrap}
 .dashv9 .tier.hi{background:var(--violet);border-color:var(--violet);color:#fff;box-shadow:0 4px 10px -4px rgba(91,75,182, .dashv9 .6)}
.dashv9 .ic svg,.dashv9 .actions .ic svg{width:20px;height:20px}
.dashv9 .sub svg{width:15px;height:15px;color:var(--violet)}
.dashv9 .actions,.dashv9 .plan,.dashv9 .actions .top{cursor:default}
.dashv9 .actions[data-go],.dashv9 .list .hd a,.dashv9 .plan .top a{cursor:pointer}
.dashv9 .chart svg{margin-top:34px}
.dashv9 .chart .ax{font-family:var(--sans)}
.dashv9 .legend span.mute{color:var(--ink-3)}
.dashv9 .empty-ov{text-align:center;color:var(--ink-3);font-size:13px;margin-top:-120px;padding-bottom:110px;position:relative}
.dashv9 .stats>.panel,.dashv9 .two>.panel{min-width:0}
.dashv9 .leads .n,.dashv9 .actions .n,.dashv9 .plan .n{background:none;border:0;box-shadow:none;width:auto;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:0}
.dashv9 .actions .due{white-space:nowrap}
.dashv9 .actions .s{max-width:16ch}

/* toggle */
.sw{position:relative;display:block;width:34px;height:20px;border-radius:999px;background:var(--bd-2);flex:none;cursor:default}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(40,30,70,.28);transition:transform .16s}
.sw.on{background:var(--purple)}
.sw.on::after{transform:translateX(14px)}
.sw.gate{background:repeating-linear-gradient(135deg,var(--bd-2),var(--bd-2) 3px,var(--chrome) 3px,var(--chrome) 6px)}
.swx{display:flex;align-items:center;gap:10px}
.swl{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-4);min-width:56px;text-align:right}
.swl.on{color:var(--purple-deep)}
.incl{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.01em;color:var(--purple-deep);
  background:var(--purple-soft);border:1px solid var(--bd-purple);border-radius:999px;padding:3px 10px}

/* request a change */
.cta{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:var(--purple-soft-2);
  border:1px solid var(--bd-purple);border-radius:var(--r-card);padding:16px 18px;margin-bottom:16px}
.cta-t{font-size:14px;color:var(--ink);font-weight:600}
.cta-s{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:4px;max-width:64ch}
.btn{font-size:12.5px;font-weight:500;color:#fff;background:var(--purple);border-radius:var(--r-ctl);padding:10px 16px;
  white-space:nowrap;box-shadow:0 6px 16px -8px color-mix(in oklab,var(--purple) 70%,transparent);transition:background .14s,transform .1s}
.btn:hover{background:var(--purple-deep)}
.btn.pulse{animation:cpulse .9s ease-out 2}
@keyframes cpulse{0%{box-shadow:0 6px 16px -8px color-mix(in oklab,var(--purple) 70%,transparent),0 0 0 0 color-mix(in oklab,var(--purple) 55%,transparent)}
  70%{box-shadow:0 6px 16px -8px color-mix(in oklab,var(--purple) 70%,transparent),0 0 0 9px transparent}
  100%{box-shadow:0 6px 16px -8px color-mix(in oklab,var(--purple) 70%,transparent),0 0 0 0 transparent}}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.btn.ghost{color:var(--purple-deep);background:var(--purple-soft);border:1px solid var(--bd-purple);box-shadow:none}
.btn.ghost:hover{background:color-mix(in oklab,var(--purple) 16%,#fff)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(23,19,32,.4);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:80;padding:24px}
.md{width:100%;max-width:500px;background:var(--panel-2);border:1px solid var(--bd-2);border-radius:18px;
  box-shadow:var(--sh-3);overflow:hidden}
.md-h{padding:18px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.md-t{font-family:var(--serif);font-size:23px;color:var(--ink);line-height:1.2}
.md-s{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.55}
.md-x{font-family:var(--sans);font-size:15px;color:var(--ink-4);padding:4px 8px;border-radius:8px}
.md-x:hover{background:var(--lilac);color:var(--ink)}
.md-b{padding:18px 20px}
.md-f{padding:14px 20px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:9px;background:var(--panel)}
.fld{margin-bottom:14px}
.fld label{display:block;font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-3);margin-bottom:6px}
.fld select,.fld textarea,.fld input{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);
  border:1px solid var(--bd-2);border-radius:var(--r-ctl);padding:10px 12px;background:#fff;resize:vertical}
.fld textarea{min-height:88px;line-height:1.55}
.fld select:focus,.fld textarea:focus,.fld input:focus{outline:2px solid var(--purple);outline-offset:-1px;border-color:var(--purple)}
.am{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--panel);border:1px solid var(--bd);
  border-radius:var(--r-ctl);margin-bottom:15px}
.am-a{width:32px;height:32px;border-radius:10px;background:var(--purple-soft);border:1px solid var(--bd-purple);
  display:grid;place-items:center;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--purple-deep);flex:none}
.am-n{display:block;font-size:13px;color:var(--ink);line-height:1.25;font-weight:500}
.am-m{display:block;font-family:var(--sans);font-size:11.5px;color:var(--ink-3);margin-top:3px}
.done{text-align:center;padding:26px 18px}
.done-m{width:40px;height:40px;border-radius:12px;background:var(--purple-soft);border:1px solid var(--bd-purple);
  display:grid;place-items:center;margin:0 auto 13px;color:var(--purple-deep);font-family:var(--sans);font-size:17px}
.done-t{font-family:var(--serif);font-size:22px;color:var(--ink)}
.done-s{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.55}

/* add-on upsell */
.md-upsell{width:100%;max-width:560px;border-radius:22px;border:1px solid var(--bd-2);
  box-shadow:var(--sh-3);overflow:hidden;position:relative;
  background:linear-gradient(180deg,var(--purple-soft) 0%,var(--panel-2) 280px)}
.upsell-x{position:absolute;top:16px;right:16px;font-family:var(--sans);font-size:15px;color:var(--ink-4);
  padding:4px 8px;border-radius:8px;z-index:1}
.upsell-x:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.upsell-body{padding:34px 34px 30px;text-align:center}
.upsell-eyebrow{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.08em;
  color:var(--purple-deep);text-transform:uppercase}
.upsell-h{font-family:var(--serif);font-size:27px;line-height:1.28;color:var(--ink);
  letter-spacing:-.005em;margin:16px 0}
.upsell-s{font-size:13.5px;color:var(--ink-3);line-height:1.65;max-width:420px;margin:0 auto 22px}
.upsell-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;text-align:left}
.upsell-card{background:var(--purple-soft-2);border:1px solid var(--bd-purple);border-radius:14px;
  padding:14px;font-size:12.5px;color:var(--ink-2);line-height:1.4}
.upsell-card i{display:block;font-style:normal;color:var(--purple-deep);font-size:15px;margin-bottom:6px}
.upsell-note{font-size:12px;color:var(--ink-4);margin-bottom:20px}
.upsell-cta{width:100%;background:var(--purple);color:#fff;font-size:14px;font-weight:600;
  border-radius:12px;padding:15px;box-shadow:0 8px 20px -10px color-mix(in oklab,var(--purple) 60%,transparent);
  transition:background .14s}
.upsell-cta:hover{background:var(--purple-deep)}
.upsell-link{display:block;margin-top:14px;font-size:12.5px;color:var(--ink-3);
  text-decoration:underline;text-underline-offset:3px}
.upsell-link:hover{color:var(--purple-deep)}
@media (max-width:640px){.upsell-cards{grid-template-columns:1fr}}
.tr{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--bd)}
.tr:first-child{border-top:0}
.tr-n{font-size:13px;color:var(--ink);line-height:1.35}
.tr-n s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3);margin-top:3px}

/* limits + logs */
.lim{display:grid;grid-template-columns:1fr 130px 96px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--bd)}
.lim:first-child{border-top:0}
.lim-n{font-size:13px;color:var(--ink);line-height:1.3}
.lim-n s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.lim-t{height:6px;border-radius:3px;background:var(--lilac);overflow:hidden}
.lim-t i{display:block;height:100%;border-radius:3px;background:var(--purple-mid)}
.lim-t i.hot{background:var(--clay)}
.lim-v{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right}
.log{display:grid;grid-template-columns:70px 108px 1fr auto;gap:14px;align-items:baseline;padding:10px 0;
  border-top:1px solid var(--bd);font-size:12.5px}
.log:first-child{border-top:0}
.log-t{font-family:var(--mono);font-size:10.5px;color:var(--ink-4)}
.log-c{font-family:var(--sans);font-size:11px;letter-spacing:.01em;color:var(--ink-3)}
.log-m{color:var(--ink-2);line-height:1.5}
.log-s{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.01em;color:var(--purple-deep);
  background:var(--purple-soft);border-radius:999px;padding:3px 9px}
.log-s.warn{color:var(--clay);background:var(--clay-soft)}
.log.w .log-m{color:var(--ink)}

/* usage chart */
.uhead{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.uv{font-family:var(--sans);font-size:36px;font-weight:600;color:var(--ink);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.uc{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.uplot{position:relative;height:170px;margin:0 0 0 52px;border-left:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.ucht{position:absolute;inset:0;width:100%;height:100%;display:block}
.uy{position:absolute;right:100%;transform:translateY(-50%);padding-right:9px;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-4);white-space:nowrap}
.uband{position:absolute;left:0;right:0;background:rgba(23,19,31,.045);pointer-events:none}
.urule{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--bd-2);pointer-events:none}
.urule.cap{border-top-color:var(--clay)}
.urule b{position:absolute;right:0;top:-9px;background:var(--panel-2);padding:0 0 0 8px;
  font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--clay);white-space:nowrap}
.urule.floor b{left:0;right:auto;color:var(--ink-4);padding:0 8px 0 0}
.ucl{display:flex;justify-content:space-between;margin:9px 0 0 52px;font-family:var(--mono);font-size:9px;color:var(--ink-4)}
.ucl .pj{color:var(--purple-mid)}
.uband-t{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:var(--sans);
  font-size:10.5px;font-weight:500;letter-spacing:.01em;color:var(--purple-deep);opacity:.8}

/* tooltips */
.ttw{display:inline-flex;align-items:center;gap:7px}
.tt{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;flex:none;
  border:1px solid var(--bd-2);background:var(--panel-2);color:var(--ink-4);cursor:help;
  font-family:var(--sans);font-size:9.5px;font-weight:600;font-style:normal;letter-spacing:0;line-height:1}
.tt:hover,.tt:focus-visible{border-color:var(--purple);color:var(--purple-deep);outline:none}
.tt em{display:none}
#tipf{position:fixed;top:0;left:0;max-width:262px;padding:12px 14px;border-radius:12px;
  background:var(--ink);color:#efedf5;font-family:var(--sans);font-style:normal;font-size:12px;font-weight:400;
  line-height:1.5;letter-spacing:0;text-align:left;text-wrap:pretty;box-shadow:var(--sh-3);
  opacity:0;visibility:hidden;transform:translateY(4px);pointer-events:none;z-index:200;
  transition:opacity .16s,transform .16s,visibility .16s}
#tipf.on{opacity:1;visibility:visible;transform:translateY(0)}

/* outcome ask */
.ask{border:1px dashed var(--bd-2);border-radius:var(--r-ctl);padding:13px 14px;margin-top:2px}
.ask-t{font-size:12.5px;color:var(--ink);font-weight:500;line-height:1.4}
.ask-s{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}
.ask-b{margin-top:11px;font-size:12px;font-weight:500;color:var(--purple-deep);border:1px solid var(--bd-purple);
  background:var(--purple-soft-2);border-radius:999px;padding:6px 13px;transition:background .14s}
.ask-b:hover{background:var(--purple-soft)}
.ask-b:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* legend */
.chart-h{display:flex;align-items:center;gap:16px}
.key{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;letter-spacing:0;color:var(--ink-4)}
.key i{width:9px;height:9px;border-radius:3px;display:block}

/* updates feed */
.q{display:grid;gap:2px}
.qg{display:flex;align-items:center;gap:9px;padding:16px 12px 8px}
.qg+.q{margin-bottom:2px}
.qg.later{border-top:1px solid var(--bd);margin-top:10px;padding-top:15px}
.qg-t{font-size:11.5px;letter-spacing:.01em;color:var(--ink-3);font-weight:600}
.qg-c{font-family:var(--mono);font-size:10px;color:var(--ink-4);background:var(--bd);
  border-radius:999px;padding:2px 7px}
.qi{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:14px;align-items:start;width:100%;
  text-align:left;padding:12px;border-radius:var(--r-ctl);
  transition:background .15s,opacity .2s,transform .2s,box-shadow .15s}
.qi:hover{background:var(--panel)}
.qi:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}
.qi.sel{background:var(--purple-soft-2);box-shadow:inset 0 0 0 1px var(--bd-purple)}
.qi.gone{opacity:0;transform:translateX(14px)}
.qi-dot{width:7px;height:7px;border-radius:999px;background:var(--bd-purple);justify-self:center;margin-top:6px}
.qi.hot .qi-dot{background:var(--purple-deep);box-shadow:0 0 0 3.5px var(--purple-soft)}
.qi-m{min-width:0;max-width:66ch}
.qi-t{display:block;font-size:13.5px;color:var(--ink);line-height:1.4;font-weight:500}
.qi-w{display:block;font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.qi-a{font-family:var(--mono);font-size:10px;color:var(--ink-4);letter-spacing:.02em}
.qi.hot .qi-a{color:var(--purple-deep)}
.qi-w b{color:var(--ink-4);font-weight:400;font-family:var(--sans);font-size:11px;letter-spacing:.01em}
.qi-do{font-size:12px;color:var(--purple-deep);white-space:nowrap;font-weight:500;align-self:center;
  min-width:136px;text-align:center;padding:7px 13px;border-radius:999px;
  border:1px solid transparent;transition:background .15s,border-color .15s}
.qi:hover .qi-do{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-color:var(--bd-purple);box-shadow:var(--glass-hi)}
.qi-do:hover{background:var(--purple-soft)}
.qi-do:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.empty{text-align:center;padding:34px 20px}
.empty-m{width:40px;height:40px;border-radius:12px;background:var(--purple-soft);border:1px solid var(--bd-purple);
  display:grid;place-items:center;margin:0 auto 13px;color:var(--purple-deep);font-family:var(--sans);font-size:17px}
.empty-t{font-family:var(--serif);font-size:22px;color:var(--ink);line-height:1.2}
.empty-s{font-size:12.5px;color:var(--ink-3);margin-top:5px;line-height:1.55;max-width:46ch;margin-left:auto;margin-right:auto}

/* generic panel */
.pl{background:linear-gradient(180deg,#fff 0%,#FCFBFE 100%);border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:16px;
  box-shadow:var(--shadow)}
.dash>.pl,.dash>.col>.pl{margin-bottom:0}
.pl-b.flush{padding:0}
.pl-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--bd)}
.pl-t{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--ink);line-height:1.2}
.pl-b{padding:16px}
.wrap{width:100%;max-width:880px;margin:0 auto}
.wrap.wide{max-width:1300px}

/* flow canvas */
.flow{display:grid;justify-items:center;max-width:560px;margin:0 auto}
.row{width:100%;display:flex;justify-content:center}
.split{display:grid;gap:12px;width:100%}
.stack{width:100%}
.n{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-bd);border-radius:var(--r-card);text-align:left;width:100%;
  box-shadow:var(--sh-1),var(--glass-hi);transition:border-color .15s,box-shadow .15s,transform .1s}
.n:hover{border-color:var(--bd-purple);box-shadow:var(--sh-2)}
.n:active{transform:translateY(1px)}
.n:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.n-h{display:flex;align-items:flex-start;gap:12px;padding:13px 14px}
.n-i{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:var(--purple-soft);color:var(--purple-deep);font-family:var(--sans);font-size:14px;margin-top:1px;
  transition:background .15s,color .15s}
.n-i svg{width:17px;height:17px;display:block}
.n-w{flex:1;min-width:0}
.n-t{font-size:14px;color:var(--ink);line-height:1.3;font-weight:600;letter-spacing:-.005em}
.n-s{font-size:12px;color:var(--ink-3);line-height:1.45;margin-top:3px}
.n-b{padding:0 14px 12px}
.n-m{display:flex;flex-wrap:wrap;gap:16px;padding:10px 14px;border-top:1px solid var(--bd);
  background:var(--purple-soft-2);border-radius:0 0 13px 13px}
.n-mi{display:flex;align-items:baseline;gap:6px}
.n-mv{font-family:var(--mono);font-size:11.5px;color:var(--purple-deep)}
.n-mk{font-size:11px;color:var(--ink-3)}
.n.sel{border-color:var(--purple);box-shadow:0 0 0 3px color-mix(in oklab,var(--purple) 16%,transparent)}
.n.firing{border-color:var(--purple);box-shadow:0 0 0 3px color-mix(in oklab,var(--purple) 14%,transparent)}
.n.firing .n-i{background:var(--purple);color:#fff}
.n.human .n-i{background:var(--clay-soft);color:var(--clay)}
.n.human.firing{border-color:var(--clay)}
.n.human.firing .n-i{background:var(--clay);color:#fff}
.n.human .n-m{background:var(--clay-soft)}
.n.human .n-mv{color:var(--clay)}
.n.off{background:var(--panel);border-style:dashed}
.n.off .n-i{background:var(--chrome-2);color:var(--ink-4)}
.n.off .n-m{background:var(--chrome)}
.n.off .n-mv{color:var(--ink-3)}
.n.off.firing{border-color:var(--ink-3)}
.n.gate{opacity:.66}
.n.out{background:var(--purple-soft);border-color:var(--bd-purple);cursor:pointer;box-shadow:none}
.n.out:hover{background:color-mix(in oklab,var(--purple) 16%,#fff);border-color:var(--purple)}
.n-go{font-family:var(--sans);font-size:14px;color:var(--purple-deep);transition:transform .15s}
.n.out:hover .n-go{transform:translateX(3px)}
.n.out .n-t{color:var(--purple-deep);text-align:center}
.n.out .n-h{justify-content:center;align-items:center;gap:9px;padding:12px 14px}
.rule{display:flex;flex-wrap:wrap;gap:6px}
.rule span{font-size:11.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--bd);
  border-radius:999px;padding:4px 10px;transition:background .15s,border-color .15s}
.rule span.dim{color:var(--ink-4);background:var(--panel);border-style:dashed}
.rule span.lit{background:var(--purple-soft);border-color:var(--bd-purple);color:var(--purple-deep)}
.c{display:grid;justify-items:center;width:100%;position:relative}
.c-l{width:1.5px;height:14px;background:var(--line);border-radius:2px}
.c-p{font-family:var(--sans);font-size:9.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;background:var(--panel-2);
  border:1px solid var(--bd-2);color:var(--ink-3);border-radius:999px;padding:3px 10px;margin:2px 0;box-shadow:var(--sh-1)}
.c-p.yes{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 4px 12px -6px color-mix(in oklab,var(--purple) 70%,transparent)}
.c-p.human{background:var(--clay);border-color:var(--clay);color:#fff}
.pw{display:flex;justify-content:center;margin-bottom:7px}
.spark{position:absolute;left:50%;margin-left:-2.5px;width:5px;height:9px;border-radius:3px;background:var(--purple);
  box-shadow:0 0 8px 2px color-mix(in oklab,var(--purple) 45%,transparent);animation:travel .6s linear forwards;
  pointer-events:none;z-index:2}
@keyframes travel{0%{top:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}
.n-mv.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}28%{transform:scale(1.13)}100%{transform:scale(1)}}

/* lanes */
.lanes{display:grid;gap:9px}
.lane{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--glass);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-bd);border-radius:var(--r-card);padding:13px 14px;
  box-shadow:var(--sh-1),var(--glass-hi)}
.lane.off{background:var(--panel);border-style:dashed}
.lane-i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--purple-soft);
  color:var(--purple-deep);font-family:var(--sans);font-size:13px}
.lane.off .lane-i{background:var(--lilac);color:var(--ink-4)}
.lane-n{font-size:13px;color:var(--ink);font-weight:600}
.lane.off .lane-n{color:var(--ink-2);font-weight:400}
.lane-d{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.pip{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.01em;padding:3px 9px;border-radius:999px}
.pip.live{background:var(--purple-soft);color:var(--purple-deep);border:1px solid var(--bd-purple)}
.pip.off{background:var(--lilac);color:var(--ink-4);border:1px solid var(--bd)}

/* rows: health, sources, settings */
.rw{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--bd)}
.rw:first-child{border-top:0}
.rw-n{font-size:12.5px;color:var(--ink);line-height:1.4}
.rw-n s{display:block;text-decoration:none;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.rw-v{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;white-space:nowrap}
.rw-v.ok{color:var(--purple-deep)}
.rw-v.warn{color:var(--clay)}
.kvr{display:grid;grid-template-columns:160px 1fr;gap:20px;padding:12px 0;border-top:1px solid var(--bd);align-items:baseline}
.kvr:first-child{border-top:0;padding-top:2px}
.kvr-k{font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.01em;color:var(--ink-3);line-height:1.6}
.kvr-v{font-size:13px;color:var(--ink);line-height:1.6}
.kvr-v em{font-style:normal;color:var(--ink-3)}
.hl{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--bd)}
.hl:first-child{border-top:0}
.hl .mk{font-family:var(--sans);font-size:11px;color:var(--purple)}
.hl.w .mk{color:var(--clay)}
.src{display:grid;grid-template-columns:128px 1fr 48px 44px;gap:10px;align-items:center;padding:6px 0}
.src-n{font-size:12px;color:var(--ink-2)}
.src-t{height:7px;border-radius:4px;background:var(--lilac);overflow:hidden}
.src-t i{display:block;height:100%;border-radius:4px;background:var(--purple-mid)}
.src-r{font-family:var(--mono);font-size:10.5px;color:var(--ink);text-align:right}
.src-v{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);text-align:right}
.insp .src{grid-template-columns:minmax(0,1fr) 42px 36px;gap:8px}
.insp .src-t{display:none}
.insp .src-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src.best .src-n{color:var(--purple-deep);font-weight:500}
.src.best .src-t i{background:var(--purple-deep)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);background:var(--panel-2);
  border:1px solid var(--bd-2);border-radius:999px;padding:5px 11px}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--purple-mid);flex:none;font-style:normal}
.chip.off{background:var(--chrome);border-style:dashed;color:var(--ink-4)}
.chip.off i{background:var(--ink-4)}
.meter{margin-top:10px}
.meter-t{height:7px;border-radius:4px;background:var(--chrome-2);overflow:hidden;margin:7px 0 6px}
.meter-t i{display:block;height:100%;border-radius:4px;background:var(--purple-mid)}
.meter-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd-2)}

/* settings sub-navigation */
.stabs{display:flex;flex-wrap:wrap;gap:3px;padding:4px;margin-bottom:18px;border-radius:13px;
  background:color-mix(in oklab,var(--chrome) 62%,transparent);border:1px solid var(--bd-2);box-shadow:var(--glass-hi)}
.stab{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:9px;font-size:12.5px;color:var(--ink-3);
  transition:background .14s,color .14s,box-shadow .14s}
.stab:hover{color:var(--ink)}
.stab.on{background:var(--panel-2);color:var(--purple-deep);font-weight:500;box-shadow:var(--sh-1),var(--glass-hi)}
.stab svg{width:15px;height:15px;display:block;opacity:.85}
.stab:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}

/* threshold ladder */
.thr{display:grid;gap:0}
.thl{display:grid;grid-template-columns:74px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--bd)}
.thl:first-child{border-top:0;padding-top:2px}
.thl-m{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-4);letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;padding-top:1px}
.thl-n{font-size:13px;color:var(--ink);line-height:1.35;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.thl-d{font-size:12px;color:var(--ink-3);line-height:1.6;margin-top:5px;max-width:62ch}
.thl.act .thl-m{color:var(--purple-deep)}
.thl.mute{opacity:.44}
.tag{font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:var(--chrome);color:var(--ink-4);border:1px solid var(--bd)}
.tag.now{background:var(--purple-soft);color:var(--purple-deep);border-color:var(--bd-purple)}
.tag.stop{background:color-mix(in oklab,var(--rose) 10%,#fff);color:var(--rose);border-color:color-mix(in oklab,var(--rose) 25%,#fff)}
.tag.pass{background:var(--clay-soft);color:var(--clay);border-color:color-mix(in oklab,var(--amber) 30%,#fff)}

/* buy credits */
.blks{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:15px 0 3px}
.step{display:flex;align-items:center;gap:2px;border:1px solid var(--bd-2);border-radius:var(--r-ctl);background:#fff;overflow:hidden}
.step button{width:34px;height:36px;display:grid;place-items:center;font-size:15px;color:var(--ink-3);transition:background .14s,color .14s}
.step button:hover{background:var(--chrome);color:var(--ink)}
.step span{min-width:52px;text-align:center;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums}
.blks-c{font-size:12px;color:var(--ink-3);line-height:1.55}
.blks-c b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* invoices + money rows */
.inv{width:100%;border-collapse:collapse;table-layout:fixed}
.inv th:nth-child(1),.inv td:nth-child(1){width:34%}
.inv th:nth-child(2),.inv td:nth-child(2){width:24%}
.inv th:nth-child(3),.inv td:nth-child(3){width:22%}
.inv th:nth-child(4),.inv td:nth-child(4){width:20%}
.inv td,.inv th{white-space:nowrap}
.inv th{text-align:left;font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-4);padding:0 0 9px;border-bottom:1px solid var(--bd)}
.inv td{padding:11px 0;border-top:1px solid var(--bd);font-size:12.5px;color:var(--ink-2);vertical-align:middle}
.inv tr:first-child td{border-top:0}
.inv td.n{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.inv td.a{text-align:right}
.inv .lnk{font-size:12px;color:var(--purple-deep)}
.inv .lnk:hover{color:var(--purple);text-decoration:underline}
.mrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--bd)}
.mrow:first-child{border-top:0;padding-top:2px}
.mrow-v{font-family:var(--sans);font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.mrow-n{display:block;font-size:13px;color:var(--ink);line-height:1.35}
.mrow-s{display:block;font-size:12px;color:var(--ink-3);line-height:1.55;margin-top:4px;max-width:60ch}
.btn.sm{padding:7px 13px;font-size:12px}
.btn.quiet{color:var(--ink-2);background:var(--panel-2);border:1px solid var(--bd-2);box-shadow:none}
.btn.quiet:hover{background:var(--chrome);color:var(--ink)}
.btn.warn{color:var(--rose);background:color-mix(in oklab,var(--rose) 10%,#fff);border:1px solid color-mix(in oklab,var(--rose) 25%,#fff);box-shadow:none}
.btn.warn:hover{background:color-mix(in oklab,var(--rose) 16%,#fff)}
.card-l{display:flex;align-items:center;gap:11px}
.card-m{width:30px;height:21px;border-radius:4px;flex:none;box-shadow:0 1px 3px rgba(40,30,70,.2);
  background:linear-gradient(135deg,#eb001b 46%,#f79e1b 46%)}
.card-m.visa{background:#1a1f71;position:relative}
.card-m.visa::after{content:'VISA';position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--sans);font-size:7.5px;font-weight:700;letter-spacing:.06em;color:#fff}
.card-m.generic{background:var(--chrome-2);border:1px solid var(--bd-2);position:relative}
.card-m.generic::after{content:'';position:absolute;left:0;right:0;top:6px;height:4px;background:var(--bd-2)}

/* profile */
.pf{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.pf .full{grid-column:1 / -1}
.pf label{display:block;font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-3);margin-bottom:6px}
.pf input,.pf select{width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff;
  border:1px solid var(--bd-2);border-radius:var(--r-ctl);padding:9px 12px}
.pf input:focus,.pf select:focus{outline:2px solid var(--purple);outline-offset:-1px;border-color:var(--purple)}
.pf input[readonly]{background:var(--chrome);color:var(--ink-3)}
.pf-h{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-4);margin:4px 0 0}
.pf-n{font-size:11.5px;color:var(--ink-4);margin-top:5px;line-height:1.5}
@media (max-width:900px){.pf{grid-template-columns:1fr}}


/* inspector */
.insp{background:var(--panel-2);border-left:1px solid var(--line);overflow-y:auto;min-height:0;transition:opacity .18s;
  box-shadow:-8px 0 22px -20px rgba(23,19,31,.5)}
.ih{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--chrome)}
.ih-k{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ih-t{font-family:var(--serif);font-size:22px;color:var(--ink);line-height:1.15;margin-top:6px;letter-spacing:-.005em}
.ih-s{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin-top:7px}
.sec{border-bottom:1px solid var(--bd);padding:16px 18px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.k{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.01em;color:var(--ink-3);margin-bottom:5px}
.v{border:1px solid var(--bd);border-radius:var(--r-ctl);background:var(--panel-2);padding:9px 11px;font-size:12px;
  color:var(--ink-2);line-height:1.55;margin-bottom:8px}
.v:last-child{margin-bottom:0}
.v b{color:var(--ink);font-weight:600}
.tag{font-family:var(--sans);font-size:9px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;
  padding:2px 6px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.tag.plan{color:var(--purple-deep);background:var(--purple-soft);border:1px solid var(--bd-purple)}
.tag.set{color:var(--clay);background:var(--clay-soft);border:1px solid color-mix(in oklab,var(--amber) 30%,transparent)}
.read{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.read b{color:var(--ink);font-weight:600}
.rec{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--bd)}
.rec:first-child{border-top:0}
.rec-t{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.rec-m{font-size:12px;color:var(--ink-2);line-height:1.45}

/* global footer */
.gfoot{margin:36px calc(-1 * var(--pad,24px)) calc(-1 * var(--pad,24px));padding:22px var(--pad,24px) 24px;
  background:color-mix(in oklab,var(--desk) 55%,#fff);border-top:1px solid var(--line);display:grid;gap:12px}
.gfoot>*{max-width:880px;width:100%;margin:0 auto}
.foot-r{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot-l{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.foot-l a{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.foot-l a:hover{color:var(--purple-deep);text-decoration:underline;text-underline-offset:3px}
.foot-a{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.foot-b{font-size:12.5px;font-weight:500;border-radius:var(--r-ctl);padding:8px 14px;white-space:nowrap;
  border:1px solid var(--bd-2);background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  color:var(--ink-2);box-shadow:var(--glass-hi);transition:border-color .14s,color .14s,background .14s}
.foot-b:hover{border-color:var(--bd-purple);color:var(--purple-deep);background:var(--purple-soft-2)}
.foot-b.pri{background:var(--purple);border-color:var(--purple);color:#fff;
  box-shadow:0 6px 16px -9px color-mix(in oklab,var(--purple) 70%,transparent)}
.foot-b.pri:hover{background:var(--purple-deep);border-color:var(--purple-deep);color:#fff}
.foot-c{font-size:12px;color:var(--ink-4)}
@media (max-width:640px){.foot-r{flex-direction:column;align-items:flex-start}.foot-a{width:100%}.foot-b{flex:1;text-align:center}}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:var(--panel-2);--glass-2:var(--panel-2);--glass-bd:var(--bd)}
  .seg{background:var(--chrome)}
}
@media (max-width:1240px){:root{--insp:284px}}
@media (max-width:1120px){:root{--insp:250px}.scroll{--pad:16px}}
@media (max-width:1040px){.two{grid-template-columns:1fr}}
@container (max-width:940px){.dashv9 .stats,.dashv9 .two{grid-template-columns:1fr}.dashv9 .head{flex-direction:column}.dashv9 .chips{flex-wrap:wrap}}
@media (max-width:780px){
  body{overflow:auto;height:auto;padding:0}
  .app{height:auto}
  /* display:block (not a 1-track grid) — deliberately avoids animating
     grid-template-columns across a track-count change (3 tracks on
     desktop to 1 on mobile), which engines interpolate inconsistently
     and is the suspected cause of a real-device width bug this fixes. */
  .shell{display:block;transition:none;overflow:visible}
  .mid{width:100%}
  .scroll{overflow:visible;min-height:0;width:100%}
  .fr{grid-template-columns:110px 1fr 56px}.fr-p{display:none}
  .split{grid-template-columns:1fr !important}
  .tb{height:auto;flex-wrap:wrap;padding:10px 14px;gap:8px 10px}
  .tb-m{display:none}
  .seg button{padding:5px 9px;font-size:11.5px}

  /* Rail becomes an off-canvas drawer, opened via .railBtn in the topbar. */
  .railBtn{display:flex}
  .nav{position:fixed;top:0;left:0;bottom:0;z-index:120;width:min(84vw,320px);
    border-right:1px solid var(--line);border-bottom:0;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:24px 0 60px -20px rgba(23,19,31,.35)}
  .shell.rail-open .nav{transform:translateX(0)}
  .shell.rail-open .rail-scrim{display:block}

  /* Details panel becomes a slide-in drawer from the right, mirroring
     the rail. Being position:fixed it never reserves layout space
     either way, so no "shut" display toggling is needed like before —
     just the same transform-based fly-out as the rail. */
  .insp{position:fixed;top:0;right:0;bottom:0;z-index:120;width:min(84vw,320px);
    border-left:1px solid var(--line);border-bottom:0;
    transform:translateX(100%);transition:transform .22s ease;
    box-shadow:-24px 0 60px -20px rgba(23,19,31,.35);overflow-y:auto}
  .shell:not(.shut):not(.noinsp) .insp{transform:translateX(0)}
  .shell:not(.shut):not(.noinsp) .insp-scrim{display:block}
  .railBtn{margin-right:2px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.spark{display:none}}
</style>

function navBtn(v,host,opt){
  opt=opt||{};
  var b=document.createElement('button');
  b.className='it'+(opt.dim?' off':'');b.dataset.v=v.id;b.type='button';
  b.innerHTML=(ICON[v.id]||'')+'<span class="lb">'+(v.nav||v.name)+'</span>'+
    '<span class="bd" id="nv-'+v.id+'">'+(opt.badge||'')+'</span>';
  b.onclick=function(){
    if(v.gate) openAddonUpsell(v);
    else if(BILL.cardDeclined && CAPS.indexOf(v)!==-1){ STAB='billing'; go('settings'); }
    else go(v.id);
    if(typeof setRail==='function') setRail(false);
  };
  host.appendChild(b);return b;
}

  var items=Array.prototype.slice.call(rail.querySelectorAll('.it'));
  var i=items.indexOf(document.activeElement);
  if(i<0)return;
  e.preventDefault();
  var next=items[e.key==='ArrowDown'?Math.min(i+1,items.length-1):Math.max(i-1,0)];
  next.focus();go(next.dataset.v);
});

function seq(items){

        (pend?'<div class="c-p '+(pend.k||'')+'">'+pend.t+'</div>':'')+'<div class="c-l"></div></div>';
    }

        opts.push({c:cid2,n:col[1]._id,w:(col[0].w===undefined?1:col[0].w)});
        cols+='<div><div class="pw c" id="'+cid2+'"><div class="c-p '+(col[0].k||'')+'">'+col[0].t+'</div></div>'+
          '<div class="stack">'+mk+'</div></div>';});
      WALK.push({k:'split',opts:opts});
      out+='<div class="split" style="grid-template-columns:repeat('+it.items.length+',1fr)">'+cols+'</div>';

function stopEngine(){

  Array.prototype.forEach.call(document.querySelectorAll('.n.firing'),function(e){e.classList.remove('firing');});
  Array.prototype.forEach.call(document.querySelectorAll('.rule span.lit'),function(e){e.classList.remove('lit');});
}
function tmr(fn,ms){var t=setTimeout(fn,ms);TIMERS.push(t);return t;}
function jit(b,r){return b+Math.random()*r;}
function fireNode(id){
  var el=document.getElementById(id);if(!el)return;
  el.classList.add('firing');tmr(function(){el.classList.remove('firing')},740);
  var cs=el.querySelectorAll('.rule span');
  if(cs.length){var k=cs[Math.floor(Math.random()*cs.length)];k.classList.add('lit');
    tmr(function(){k.classList.remove('lit')},660);}

    if(m){var num=parseInt(m[1].replace(/,/g,''),10);

        v.classList.remove('bump');void v.offsetWidth;v.classList.add('bump');}}}

function sparkOn(id){
  if(motionOff())return;
  var c=document.getElementById(id);if(!c)return;

function weighted(opts){var t=0,i;for(i=0;i<opts.length;i++)t+=opts[i].w;
  var r=Math.random()*t,a=0;for(i=0;i<opts.length;i++){a+=opts[i].w;if(r<=a)return opts[i];}return opts[0];}
function walk(i){
  if(i>=WALK.length)return;
  var st=WALK[i];
  if(st.k==='conn'){sparkOn(st.id);tmr(function(){walk(i+1)},motionOff()?230:590);}
  else if(st.k==='node'){fireNode(st.id);tmr(function(){walk(i+1)},jit(460,380));}
  else{var o=weighted(st.opts);sparkOn(o.c);
    tmr(function(){fireNode(o.n);tmr(function(){walk(i+1)},jit(460,380));},motionOff()?230:590);}
}
function startEngine(){
  stopEngine();if(!WALK.length)return;
  if(window.__RB_MOTION===false)return;
  var spawn=function(){walk(0);tmr(spawn,jit(1900,2400));};
  tmr(spawn,400);
}

function niceMax(max){
  var S=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,2500,5000,10000];
  for(var i=0;i<S.length;i++) if(4*S[i]>=max) return 4*S[i];
  return Math.ceil(max/40000)*40000;
}
function lineChart(days,series){
  var X0=60,X1=1220,Y0=20,Y1=180,n=days.length;
  var live=series.filter(function(s){return s.values!==null});
  var dataMax=0;live.forEach(function(s){s.values.forEach(function(v){if(v>dataMax)dataMax=v})});
  var max=niceMax(dataMax), step=n>1?(X1-X0)/(n-1):0;
  var x=function(i){return n>1?X0+i*step:(X0+X1)/2}, y=function(v){return Y1-(v/max)*(Y1-Y0)};
  var pt=function(i,v){return Math.round(x(i))+','+Math.round(y(v))};
  var grid=[Y0,Y0+40,Y0+80,Y0+120,Y1];
  var yT=grid.map(function(gy,k){return {y:gy+4,label:String(Math.round(max-(k*max)/4))}});
  var xT=[];for(var i=0;i<n;i++) if(i%5===0||i===n-1) xT.push({x:Math.round(x(i)),label:days[i]});
  var lines=live.map(function(s){return {id:s.id,color:s.color,d:s.values.map(function(v,i){return (i===0?'M':'L')+pt(i,v)}).join(' ')}});
  var area=(live[0]&&n>0)?{color:live[0].color,d:lines[0].d+' L'+Math.round(x(n-1))+','+Y1+' L'+X0+','+Y1+' Z'}:null;
  var h='<svg viewBox="0 0 1240 240" role="img" aria-label="Daily activity">';
  if(area) h+='<defs><linearGradient id="gcv9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+area.color+'" stop-opacity=".25"/><stop offset="1" stop-color="'+area.color+'" stop-opacity="0"/></linearGradient></defs>';
  h+='<g stroke="#e7e6ee" stroke-width="1">'+grid.map(function(g){return '<line x1="60" y1="'+g+'" x2="1220" y2="'+g+'"/>'}).join('')+'</g>';
  h+='<g class="ax" fill="#8a889b" font-size="12" text-anchor="end">'+yT.map(function(t){return '<text x="48" y="'+t.y+'">'+t.label+'</text>'}).join('')+'</g>';
  if(area) h+='<path fill="url(#gcv9)" d="'+area.d+'"/>';
  h+=lines.map(function(l,i){return '<path fill="none" stroke="'+l.color+'" stroke-width="'+(i===0?'2.2':'2')+'" d="'+l.d+'"/>'}).join('');
  h+='<g class="ax" fill="#4f4c66" font-size="12" text-anchor="middle">'+xT.map(function(t){return '<text x="'+t.x+'" y="206">'+t.label+'</text>'}).join('')+'</g>';
  return h+'</svg>';
}

function projMonth(cum){
  var days=cum.length*7;
  return Math.round(cum[cum.length-1]/days*31);
}
function usageChart(v){
  var cap=ALLOWANCE.leads, floor=ALLOWANCE.bandFrom;
  var n=v.cum.length, last=v.cum[n-1];
  var proj=projMonth(v.cum);
  var top=Math.max(cap,proj)*1.12;
  var y=function(val){return (100-(val/top)*100);};
  var x=function(i){return (i/n)*82;};

  var pts=v.cum.map(function(val,i){return x(i+1).toFixed(1)+','+y(val).toFixed(1);});
  pts.unshift('0,'+y(0).toFixed(1));
  var line=pts.join(' ');
  var area=line+' '+x(n).toFixed(1)+',100 0,100';

  var ticks=[0,Math.round(cap/2/100)*100,cap,Math.round(top/100)*100];
  var axis=ticks.map(function(t){
    return '<span class="uy" style="top:'+y(t).toFixed(1)+'%">'+fmt(t)+'</span>';}).join('');

  return '<div class="uplot">'+axis+
    '<div class="uband" style="top:'+y(cap).toFixed(1)+'%;height:'+(y(floor)-y(cap)).toFixed(1)+'%">'+
      '<span class="uband-t">'+ALLOWANCE.plan+' band</span></div>'+
    '<div class="urule cap" style="top:'+y(cap).toFixed(1)+'%"><b>'+fmt(cap)+' allowance</b></div>'+
    '<div class="urule floor" style="top:'+y(floor).toFixed(1)+'%"><b>'+fmt(floor)+' band starts</b></div>'+
    '<svg class="ucht" viewBox="0 0 100 100" preserveAspectRatio="none">'+
      '<polygon points="'+area+'" fill="color-mix(in oklab, var(--purple) 18%, transparent)"/>'+
      '<polyline points="'+line+'" fill="none" stroke="var(--purple-deep)" stroke-width="1.8" '+
        'vector-effect="non-scaling-stroke" stroke-linejoin="round"/>'+
      '<line x1="'+x(n).toFixed(1)+'" y1="'+y(last).toFixed(1)+'" x2="100" y2="'+y(proj).toFixed(1)+'" '+
        'stroke="var(--purple-mid)" stroke-width="1.6" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>'+
    '</svg></div>'+
    '<div class="ucl"><span>'+v.cumL.join('</span><span>')+'</span><span class="pj">month end</span></div>';
}

/* generic modal shell */
function openModal(o){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="md" role="dialog" aria-modal="true">'+
    '<div class="md-h"><div><div class="md-t">'+o.title+'</div>'+
    '<div class="md-s">'+o.sub+'</div></div>'+
    '<button class="md-x" type="button" data-x="1" aria-label="Close">✕</button></div>'+
    '<div class="md-b" data-body="1">'+o.body+'</div>'+
    '<div class="md-f" data-foot="1">'+o.foot+'</div></div>';
  document.body.appendChild(ov);
  var onKey=function(e){if(e.key==='Escape')close();};
  function close(){ov.remove();document.removeEventListener('keydown',onKey);if(o.onClose)o.onClose();}
  document.addEventListener('keydown',onKey);
  ov.onclick=function(e){if(e.target===ov)close();};
  ov.querySelector('[data-x]').onclick=close;
  var api={ov:ov,close:close,
    body:ov.querySelector('[data-body]'),foot:ov.querySelector('[data-foot]'),
    g:function(id){return ov.querySelector('#'+id);},
    done:function(t,s){
      api.body.innerHTML='<div class="done"><div class="done-m">✓</div>'+
        '<div class="done-t">'+t+'</div><div class="done-s">'+s+'</div></div>';
      api.foot.innerHTML='<button class="btn" type="button" data-done="1">Close</button>';
      api.foot.querySelector('[data-done]').onclick=close;
    }};
  if(o.wire)o.wire(api);
  return api;
}

function openCard(after){
  return openModal({
    title:'Payment method',
    sub:'Charged on the 10th of each month, plus any overage blocks used.',
    body:'<div class="fld"><label for="cdName">Name on card</label>'+
      '<input id="cdName" value="'+esc(PROFILE.first+' '+PROFILE.last)+'" autocomplete="cc-name"></div>'+
      '<div class="fld"><label for="cdNum">Card number</label>'+
      '<input id="cdNum" inputmode="numeric" placeholder="1234 5678 9012 3456" autocomplete="cc-number"></div>'+
      '<div class="pf"><div><label for="cdExp">Expiry</label>'+
      '<input id="cdExp" placeholder="MM / YY" inputmode="numeric" autocomplete="cc-exp"></div>'+
      '<div><label for="cdCvc">Security code</label>'+
      '<input id="cdCvc" placeholder="123" inputmode="numeric" autocomplete="cc-csc"></div>'+
      '<div class="full"><label for="cdZip">Billing postal code</label>'+
      '<input id="cdZip" value="'+esc(PROFILE.zip)+'"></div></div>'+
      '<div class="pf-n" style="margin-top:12px">Replacing the card here also clears any decline that has paused capture.</div>',
    foot:'<button class="btn ghost" type="button" id="cdCancel">Cancel</button>'+
      '<button class="btn" type="button" id="cdSave">Save card</button>',
    wire:function(api){
      api.g('cdCancel').onclick=api.close;
      var num=api.g('cdNum');
      num.oninput=function(){
        var d=num.value.replace(/\D/g,'').slice(0,16);
        num.value=d.replace(/(.{4})/g,'$1 ').trim();
      };
      var exp=api.g('cdExp');
      exp.oninput=function(){
        var d=exp.value.replace(/\D/g,'').slice(0,4);
        exp.value=d.length>2?d.slice(0,2)+' / '+d.slice(2):d;
      };
      api.g('cdSave').onclick=function(){
        var d=num.value.replace(/\D/g,'');
        if(d.length<12){num.focus();num.style.borderColor='var(--clay)';return;}
        var brand=d.charAt(0)==='4'?'Visa':d.charAt(0)==='5'?'Mastercard':'Card';
        BILL.brand=d.charAt(0)==='4'?'visa':d.charAt(0)==='5'?'mc':'generic';
        BILL.card=brand+' •••• '+d.slice(-4);
        BILL.cardExp=exp.value?'Expires '+exp.value:BILL.cardExp;
        BILL.cardDeclined=false;
        if(after)after();
        api.done('Card updated','Future invoices and any overage blocks are charged to <b>'+BILL.card+'</b>.');
      };
      setTimeout(function(){num.focus();},40);
    }
  });
}

function openBuy(after){
  var blocks=OVER.buy;
  var line=function(){
    return blocks+' block'+(blocks>1?'s':'')+' · <b>'+fmt(blocks*OVER.block)+'</b> extra enquiries · <b>'+
      usd(blocks*OVER.blockPrice)+'</b>';
  };
  return openModal({
    title:'Buy usage credits',
    sub:usd(OVER.blockPrice)+' per block of '+OVER.block+' enquiries. Credits never expire and are drawn down before your card is charged.',
    body:'<div class="blks" style="padding-top:0">'+
      '<div class="step"><button type="button" id="bmD" aria-label="Fewer blocks">−</button>'+
      '<span id="bmN">'+blocks+'</span><button type="button" id="bmU" aria-label="More blocks">+</button></div>'+
      '<div class="blks-c" id="bmL">'+line()+'</div></div>'+
      '<div class="mrow" style="margin-top:16px"><div class="card-l"><span class="card-m '+BILL.brand+'"></span>'+
      '<span><span class="mrow-n" id="bmCard">'+BILL.card+'</span>'+
      '<span class="mrow-s">Charged immediately.</span></span></div>'+
      '<button class="btn sm quiet" type="button" id="bmCard2">Change</button></div>'+
      '<div class="mrow"><div><div class="mrow-n">Balance after purchase</div>'+
      '<div class="mrow-s">Currently '+usd(OVER.balance)+'.</div></div>'+
      '<span class="mrow-v" id="bmBal">'+usd(OVER.balance+blocks*OVER.blockPrice)+'</span></div>',
    foot:'<button class="btn ghost" type="button" id="bmCancel">Cancel</button>'+
      '<button class="btn" type="button" id="bmBuy">Pay '+usd(blocks*OVER.blockPrice)+'</button>',
    wire:function(api){
      var sync=function(){
        api.g('bmN').textContent=blocks;
        api.g('bmL').innerHTML=line();
        api.g('bmBal').textContent=usd(OVER.balance+blocks*OVER.blockPrice);
        api.g('bmBuy').textContent='Pay '+usd(blocks*OVER.blockPrice);
      };
      api.g('bmD').onclick=function(){blocks=Math.max(1,blocks-1);sync();};
      api.g('bmU').onclick=function(){blocks=Math.min(20,blocks+1);sync();};
      api.g('bmCancel').onclick=api.close;
      api.g('bmCard2').onclick=function(){api.close();openCard(after);};
      api.g('bmBuy').onclick=function(){
        OVER.balance+=blocks*OVER.blockPrice;OVER.buy=blocks;
        if(after)after();
        api.done('Credits added',fmt(blocks*OVER.block)+' enquiries of credit are on the account. '+
          'Your balance is <b>'+usd(OVER.balance)+'</b>, drawn down before any per-enquiry billing.');
      };
    }
  });
}

  SETTINGS.systems.forEach(function(r){items.push('Integrations: '+r[0]);});
  items.push('Plan or seats');items.push('Something else');
  if(opts.preselect && items.indexOf(opts.preselect)===-1) items.unshift(opts.preselect);

  var ov=document.createElement('div');ov.className='ov';ov.id='reqOv';
  ov.innerHTML='<div class="md" role="dialog" aria-modal="true" aria-labelledby="reqT">'+
    '<div class="md-h"><div><div class="md-t" id="reqT">Request a change</div>'+

    '<div class="md-b" id="reqBody">'+
      '<div class="am"><span class="am-a">S</span><span><span class="am-n">Sebastian Scott</span>'+
      '<span class="am-m">Account executive</span></span></div>'+
      '<div class="fld"><label for="reqWhat">What would you like changed</label>'+
      '<select id="reqWhat">'+items.map(function(i){return '<option'+(i===opts.preselect?' selected':'')+'>'+i+'</option>';}).join('')+'</select></div>'+
      '<div class="fld" style="margin-bottom:'+(opts.infoUrl?'8px':'0')+'"><label for="reqNote">What should it be instead</label>'+
      '<textarea id="reqNote" placeholder="For example: add Outlook for the two agents who do not use Google."></textarea></div>'+
      (opts.infoUrl?'<a href="'+opts.infoUrl+'" target="_blank" rel="noopener" style="font-size:12.5px">More information about this \u2192</a>':'')+
    '</div>'+
    '<div class="md-f" id="reqFoot"><button class="btn ghost" type="button" id="reqCancel">Cancel</button>'+
    '<button class="btn" type="button" id="reqSend">Send request</button></div></div>';
  document.body.appendChild(ov);

  var close=function(){var e=document.getElementById('reqOv');if(e)e.remove();document.removeEventListener('keydown',esc);};
  var esc=function(e){if(e.key==='Escape')close();};
  document.addEventListener('keydown',esc);
  ov.onclick=function(e){if(e.target===ov)close();};
  document.getElementById('reqX').onclick=close;
  document.getElementById('reqCancel').onclick=close;
  document.getElementById('reqSend').onclick=function(){
    var what=document.getElementById('reqWhat').value;
    document.getElementById('reqBody').innerHTML='<div class="done"><div class="done-m">\u2713</div>'+
      '<div class="done-t">Sent to Sebastian</div><div class="done-s">Your request about <b>'+what+
      '</b> is with your account executive. You will hear back within a working day, and nothing changes until you have agreed it.</div></div>';
    document.getElementById('reqFoot').innerHTML='<button class="btn" type="button" id="reqDone">Close</button>';
    document.getElementById('reqDone').onclick=close;
  };
  setTimeout(function(){var f=document.getElementById('reqWhat');if(f)f.focus();},40);
}

/* inspector for capabilities */
function inspectCap(v){
  var per=perLabel();
  var right=v.gate?v.state:(pv(v.vol)+' '+per);
  var h='<div class="ih"><div class="ih-k"><span class="lbl">'+v.code+'</span><span class="lbl">'+right+'</span></div>'+
    '<div class="ih-t">'+v.name+'</div><div class="ih-s">'+v.sub+'</div></div>';
  if(v.ch){
    var live=v.ch.list.filter(function(c){return c[1]}).length;
    var r2=v.ch.n?(live+' of '+v.ch.list.length+' on'):(live?live+' connected':'none connected');
    h+='<div class="sec"><div class="sec-h"><span class="lbl">'+v.ch.l+'</span>'+
      '<span class="lbl">'+r2+'</span></div>'+chips(v.ch.list,v.ch.off)+'</div>';
  }
  if(v.cfg) h+='<div class="sec"><div class="sec-h"><span class="lbl">Configuration</span><span class="lbl">read only</span></div>'+kv(v.cfg)+'</div>';
  if(v.sources) h+='<div class="sec"><div class="sec-h"><span class="lbl">Enquiry sources</span><span class="lbl">book rate</span></div>'+srcRows()+'</div>';
  if(v.recs&&v.recs.length) h+='<div class="sec"><div class="sec-h"><span class="lbl">Recent records</span></div>'+
    v.recs.map(function(r){return '<div class="rec"><span class="rec-t">'+r[0]+'</span><span class="rec-m">'+r[1]+'</span></div>';}).join('')+'</div>';
  insp.innerHTML=h;
}
function inspectNode(nd){
  var h='<div class="ih"><div class="ih-k"><span class="lbl">'+VIEW.name+'</span></div>'+
    '<div class="ih-t">'+nd.t+'</div><div class="ih-s">'+nd.s+'</div></div>';
  if(nd.rule) h+='<div class="sec"><div class="sec-h"><span class="lbl">Your rule</span></div>'+ruleHTML(nd.rule)+'</div>';
  if(nd.why) h+='<div class="sec"><div class="sec-h"><span class="lbl">Why it matters</span></div>'+
    nd.why.map(function(t){return '<div class="v">'+t+'</div>';}).join('')+'</div>';
  if(nd.m) h+='<div class="sec"><div class="sec-h"><span class="lbl">This period</span></div>'+
    nd.m.map(function(x){return '<div class="v"><b>'+pv(x[0])+'</b> '+x[1]+'</div>';}).join('')+'</div>';
  insp.innerHTML=h;
}
function pick(id){
  Array.prototype.forEach.call(document.querySelectorAll('.n'),function(e){e.classList.remove('sel')});
  var el=document.getElementById(id);if(el)el.classList.add('sel');
  SEL=id;inspectNode(REG[id]);
}

/* routing */
function go(id){
  var v=null;for(var i=0;i<ALL.length;i++){if(ALL[i].id===id){v=ALL[i];break;}}
  if(!v)return;
  VIEW=v;NID=0;CID=0;REG={};WALK=[];SEL=null;stopEngine();
  Array.prototype.forEach.call(document.querySelectorAll('.nav .it'),function(e){
    var on=e.dataset.v===id;e.classList.toggle('on',on);
    if(on)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current');});
  tbT.textContent=v.name;
  var steps=(v.flow||[]).filter(function(x){return x.el!=='p'}).length;
  tbM.innerHTML=(v.tech||'') + (v.flow?' &nbsp;·&nbsp; '+steps+' steps':'');
  var noSeg={operation:1,inbox:1,help:1,logs:1,settings:1,health:1};
  document.getElementById('seg').style.visibility = noSeg[v.id] ? 'hidden' : 'visible';
  SHELL.classList.toggle('noinsp', v.insp===false);
  if(v.id==='operation') viewOperation(v);
  else if(v.id==='inbox') viewInbox(v);
  else if(v.id==='help') viewHelp(v);
  else if(v.id==='health') viewHealth(v);
  else if(v.id==='usage') viewUsage(v);
  else if(v.id==='settings') viewSettings(v);
  else viewCap(v);
  scroll.insertAdjacentHTML('beforeend',FOOT);
  scroll.scrollTop=0;
}
function setPeriod(p){
  if(!CORE[p])return;
  PERIOD=p;
  Array.prototype.forEach.call(document.querySelectorAll('#seg button'),function(x){x.classList.toggle('on',x.dataset.p===p)});
  badges();
  if(VIEW)go(VIEW.id);
}
document.getElementById('seg').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  setPeriod(b.dataset.p);
};
var IPIN=document.getElementById('ipin'), IPINL=document.getElementById('ipinL');
function setInsp(open){
  SHELL.classList.toggle('shut',!open);
  IPIN.classList.toggle('off',!open);
  IPIN.setAttribute('aria-expanded',open?'true':'false');
  IPIN.title=open?'Hide the detail panel':'Show the detail panel';
  try{localStorage.setItem('rb.insp',open?'1':'0')}catch(_){}
}
(function(){
  var saved=null;try{saved=localStorage.getItem('rb.insp')}catch(_){}
  setInsp(saved===null ? window.innerWidth>1040 : saved==='1');
})();
IPIN.onclick=function(){setInsp(SHELL.classList.contains('shut'))};
document.addEventListener('keydown',function(e){
  if(e.key==='.'&&(e.metaKey||e.ctrlKey)){e.preventDefault();IPIN.click();}
});

var RAILBTN=document.getElementById('railBtn'), RAILSCRIM=document.getElementById('railScrim');
function setRail(open){
  SHELL.classList.toggle('rail-open',open);
  RAILBTN.setAttribute('aria-expanded',open?'true':'false');
  RAILBTN.title=open?'Close menu':'Open menu';
}
RAILBTN.onclick=function(){setRail(!SHELL.classList.contains('rail-open'))};
RAILSCRIM.onclick=function(){setRail(false)};
var INSPSCRIM=document.getElementById('inspScrim');
INSPSCRIM.onclick=function(){setInsp(false)};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){setRail(false);setInsp(false);}});

/* desktop collapse to the 64px icon rail (v9) — persisted; ignored under the mobile breakpoint by CSS */
var NAVTG=document.getElementById('navTg');
function setMin(min){
  SHELL.classList.toggle('min',min);rail.classList.toggle('min',min);
  NAVTG.setAttribute('aria-pressed',min?'true':'false');
  NAVTG.setAttribute('aria-label',min?'Expand menu':'Collapse menu');
  try{localStorage.setItem('rb.rail.min',min?'1':'0')}catch(_){}
}
NAVTG.onclick=function(){setMin(!SHELL.classList.contains('min'))};
(function(){var s=null;try{s=localStorage.getItem('rb.rail.min')}catch(_){}if(s==='1')setMin(true);})();

/* boot check: every period bucket must exist for every view (a missing key renders "undefined") */
(function(){
  ['today','week','month','calmonth'].forEach(function(p){
    if(!CORE[p]) console.error('CORE missing period',p);
    if(!SERIES[p]) console.error('SERIES missing period',p);
  });
  var mk=Object.keys(CORE.month);
  ['today','week','calmonth'].forEach(function(p){mk.forEach(function(k){if(CORE[p][k]===undefined)console.error('CORE.'+p+' missing',k);});});
})();
go('operation');

</script>
