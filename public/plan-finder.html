<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which plan is right for you? — Rosebud</title>
<meta name="description" content="Answer a few questions about your lead volume and setup, and we'll point you to the Rosebud Solutions plan that fits — Start, Grow, Expand or Scale.">
<link rel="canonical" href="https://rosebud.global/plan-finder">
<meta property="og:title" content="Which plan is right for you? — Rosebud">
<meta property="og:description" content="Answer a few questions about your lead volume and setup, and we'll point you to the Rosebud Solutions plan that fits — Start, Grow, Expand or Scale.">
<meta property="og:url" content="https://rosebud.global/plan-finder">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Which plan is right for you? — Rosebud">
<meta name="twitter:description" content="Answer a few questions about your lead volume and setup, and we'll point you to the Rosebud Solutions plan that fits — Start, Grow, Expand or Scale.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#8B7DD8; --purpleDeep:#6E5FB8; --ink:#17131F; --rust:#B15A28;
    --cream:#F5F1EA; --line:rgba(23,19,31,.10); --sub:rgba(23,19,31,.58);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cream)}
  body{
    font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:var(--ink);
    -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;
    background:
      radial-gradient(1100px 700px at 8% -12%, rgba(139,125,216,.55), transparent 62%),
      radial-gradient(900px 620px at 100% 4%, rgba(184,174,219,.50), transparent 58%),
      radial-gradient(1000px 800px at 50% 120%, rgba(139,125,216,.38), transparent 62%),
      linear-gradient(160deg,#F5F1EA,#EAE6F3 55%,#F5F1EA);
  }
  a{color:var(--purpleDeep);text-decoration:none}
  a:hover{color:#57489E}

  header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px clamp(22px,5vw,54px) 0}
  .brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:700;color:var(--purpleDeep)}
  .brand span{color:rgba(23,19,31,.4);font-weight:600}
  .stepLabel{font-size:12px;font-weight:600;color:rgba(23,19,31,.5);font-variant-numeric:tabular-nums;white-space:nowrap}
  .prog{display:flex;gap:6px;padding:14px clamp(22px,5vw,54px) 0}
  .seg{flex:1;height:4px;border-radius:99px;background:var(--line);transition:background .3s ease}
  .seg.done{background:var(--purple)}
  .seg.now{background:rgba(139,125,216,.45)}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:34px clamp(22px,5vw,54px) 60px}
  .stage{width:100%;max-width:640px}

  @keyframes qIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes burst{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.9);opacity:0}}
  @keyframes spinRing{to{transform:rotate(360deg)}}
  @keyframes scorePop{0%{opacity:0;transform:translateY(8px) scale(.92)}100%{opacity:1;transform:none}}
  .fade{animation:qIn .4s cubic-bezier(.4,0,.2,1)}

  .kicker{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--rust);margin-bottom:14px}
  h1.q{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(26px,3.2vw,36px);line-height:1.16;
    letter-spacing:-.01em;margin:0 0 12px;text-wrap:pretty}
  .qSub{font-size:14.5px;line-height:1.6;color:var(--sub);margin:0 0 26px;max-width:520px;text-wrap:pretty}

  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:17px 18px;border-radius:15px;
    cursor:pointer;text-align:left;font-family:inherit;font-size:15.5px;font-weight:500;line-height:1.4;color:var(--ink);
    background:rgba(255,255,255,.72);border:1.5px solid var(--line);
    transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease}
  .opt:hover{border-color:rgba(139,125,216,.55);background:rgba(255,255,255,.9);transform:translateY(-1px)}
  .opt.on{background:rgba(255,255,255,.95);border-color:var(--purple);box-shadow:0 18px 40px -22px rgba(139,125,216,.9);transform:scale(1.01)}
  .opt .k{flex-shrink:0;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;background:rgba(23,19,31,.06);color:rgba(23,19,31,.45);
    transition:background .18s ease,color .18s ease}
  .opt.on .k{background:var(--purple);color:#fff}
  .opt .lbl{flex:1;text-align:left}
  .opt .arw{font-size:15px;color:rgba(23,19,31,.25);flex-shrink:0}
  .opt.on .arw{opacity:0}
  .opt .ring{position:absolute;inset:0;border-radius:15px;border:2px solid rgba(139,125,216,.55);
    animation:burst .5s ease-out forwards;pointer-events:none}

  .cont{margin-top:22px;border:0;padding:15px 30px;border-radius:13px;font-family:inherit;font-size:15px;font-weight:700;
    background:var(--purple);color:#fff;cursor:pointer;box-shadow:0 16px 38px -18px rgba(139,125,216,.9);transition:all .2s ease}
  .cont[disabled]{background:rgba(23,19,31,.12);color:rgba(23,19,31,.4);box-shadow:none;cursor:default}
  .footRow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:26px}
  .back{background:none;border:0;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:rgba(23,19,31,.5);padding:0}
  .hint{font-size:12px;color:rgba(23,19,31,.4)}

  .calc{display:flex;flex-direction:column;align-items:flex-start;gap:22px;padding:30px 0}
  .ring{width:44px;height:44px;border-radius:999px;border:3px solid rgba(139,125,216,.2);border-top-color:var(--purple);
    animation:spinRing .7s linear infinite}
  .calc h2{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,3vw,32px);font-weight:500;margin:0}

  .card{background:rgba(255,255,255,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,.75);border-radius:24px;padding:clamp(28px,4.5vw,46px);
    box-shadow:0 28px 70px -38px rgba(23,19,31,.4),inset 0 1px 0 rgba(255,255,255,.6)}
  .recHead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .recName{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,6vw,60px);line-height:1;letter-spacing:-.02em;margin:0}
  .recPriceWrap{animation:scorePop .5s ease .25s backwards;text-align:right}
  .recPriceRow{display:flex;align-items:baseline;gap:4px;justify-content:flex-end}
  .recPrice{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1}
  .recPer{font-size:13px;font-weight:600;color:rgba(23,19,31,.5)}
  .recYear{font-size:12.5px;color:rgba(23,19,31,.5);margin-top:5px}
  .recDesc{font-size:15.5px;line-height:1.65;color:rgba(23,19,31,.62);margin:22px 0 26px;max-width:540px;text-wrap:pretty}

  .specGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:22px}
  .spec{background:rgba(255,255,255,.75);padding:16px 17px}
  .specLab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(23,19,31,.45);font-weight:700;margin-bottom:6px}
  .specVal{font-size:14px;font-weight:600;line-height:1.35}

  .echo{background:rgba(139,125,216,.09);border:1px solid rgba(139,125,216,.2);border-radius:16px;padding:18px 20px;margin-bottom:26px}
  .echoLab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--purpleDeep);font-weight:700;margin-bottom:11px}
  .echoList{display:flex;flex-direction:column;gap:8px}
  .echoRow{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;line-height:1.5;color:rgba(23,19,31,.78)}
  .echoRow svg{margin-top:4px;flex-shrink:0}

  .ctaFull{display:block;text-align:center;background:var(--purple);color:#fff;border-radius:14px;padding:17px 26px;
    font-size:15.5px;font-weight:700;box-shadow:0 18px 40px -18px rgba(139,125,216,.95);transition:transform .2s ease}
  .ctaFull:hover{transform:translateY(-2px);color:#fff}
  .ctaLink{display:block;text-align:center;margin-top:14px;font-size:13.5px;font-weight:600;color:rgba(23,19,31,.55);text-decoration:underline}
  .ctaLink:hover{color:var(--purpleDeep)}
  .retakeWrap{text-align:center;margin-top:18px}
  .retake{background:none;border:0;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:rgba(23,19,31,.45);padding:0}

  @media(max-width:520px){.specGrid{grid-template-columns:minmax(0,1fr)}.recHead{align-items:flex-start}.recPriceWrap{text-align:left}.recPriceRow{justify-content:flex-start}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">Rosebud <span>Plan Finder</span></div>
  <div class="stepLabel" id="stepLabel"></div>
</header>
<div class="prog" id="prog"></div>

<main><div class="stage" id="stage"></div></main>

<script>
/* ---- CONFIG: point these at your real routes ---- */
const PRICING_URL = plan => "/pricing?plan=" + plan;
const CAL_URL     = "https://cal.eu/rosebudsolutions/demo";

/* tier idx: 0 Start · 1 Grow · 2 Expand · 3 Scale · 4 Enterprise */
const QUESTIONS=[
 {key:"stage",kicker:"Starting point",q:"Where is your business right now?",
  sub:"This sets the starting point. We'll refine it with the next three questions.",
  options:["Just getting going, finding my feet","Up and running, ready to reach more people","Established and busy, ready to automate","Scaling fast, or running multiple sites"],map:[0,1,2,3]},
 {key:"leads",kicker:"Enquiries",q:"How many new enquiries do you handle a month?",
  sub:"Every call, form, DM, or message is one enquiry. This is the limit most businesses hit first.",
  options:["Up to 500","500 – 1,800","2,000 – 3,500","4,000 or more"],map:[0,1,2,3]},
 {key:"channels",kicker:"Channels",multi:true,q:"How do your customers reach you?",
  sub:"Pick every channel you use. Email, text and web forms come as standard; WhatsApp and Instagram sit on the higher plans, so they can lift your recommendation.",
  options:["A web form on your site","Email","Text / SMS","WhatsApp","Instagram DMs"],map:[0,0,0,1,3]},
 {key:"team",kicker:"Team & setup",q:"Who needs access, and how bespoke is your setup?",
  sub:"One login per person who works in the system. Multiple brands or custom integrations move you to a bespoke plan.",
  options:["Just me (1–2 logins)","A small team (up to 5)","A bigger team (up to 10)","Multiple brands, custom integrations, or an API"],map:[0,1,2,4]},
];

const AFFIRM=[
 "You're getting going, and every enquiry counts.",
 "You're up and running and ready to reach more people.",
 "You're established and busy, ready to take the manual work off your plate.",
 "You're scaling fast, and you want the full engine behind you.",
];

const TIERS=[
 {name:"Start",price:"£660",per:"/mo",year:"or £594/mo billed yearly",
  gives:"Start runs the six core flows end to end — capture, qualify, book, remind, nurture, and sync to your CRM — over email and SMS.",
  leads:"Up to 500 / mo",seats:"2 seats",channels:"Email & SMS",unlocks:"The six core flows"},
 {name:"Grow",price:"£1,650",per:"/mo",year:"or £1,485/mo billed yearly",
  gives:"Grow adds WhatsApp, a longer nurture cadence, and seats for a small team.",
  leads:"600–1,800 / mo",seats:"5 seats",channels:"Email, SMS & WhatsApp",unlocks:"WhatsApp, longer nurture"},
 {name:"Expand",price:"£2,500",per:"/mo",year:"or £2,250/mo yearly · £3,250 with attribution",
  gives:"Expand handles serious volume with deeper no-show recovery, a full team, and Closed-Loop Attribution on by default.",
  leads:"2,000–3,500 / mo",seats:"10 seats",channels:"Email, SMS & WhatsApp",unlocks:"Deeper recovery, attribution included"},
 {name:"Scale",price:"£4,900",per:"/mo",year:"or £4,410/mo yearly · £5,650 with attribution",
  gives:"Scale is the full engine — every channel including Instagram, the deepest cadences, twenty seats, and attribution included.",
  leads:"4,000 / mo",seats:"20 seats",channels:"Email, SMS, WhatsApp & Instagram",unlocks:"Instagram, deepest cadences, attribution"},
 {name:"Enterprise",price:"Custom",per:"",year:"Priced to your setup",enterprise:true,
  gives:"Enterprise is priced to your setup — multiple brands, custom integrations, API access, and bespoke SLAs.",
  leads:"Above 4,000 / bespoke",seats:"Custom",channels:"All channels",unlocks:"Custom integrations, API, SLAs"},
];

const LEAD_TXT=["up to 500 enquiries a month","500 to 1,800 enquiries a month","2,000 to 3,500 enquiries a month","4,000+ enquiries a month"];
const TEAM_TXT=["just you","a team of up to 5","a team of up to 10","multiple brands or a custom setup"];
const TOTAL=QUESTIONS.length;
const TICK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E5FB8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';

let pos=0, answers={}, multiSel=[], picked=null, phase="q";
const stage=document.getElementById("stage"), progEl=document.getElementById("prog"), stepEl=document.getElementById("stepLabel");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function recommend(a){
  let t=0;
  QUESTIONS.forEach(q=>{const ans=a[q.key];if(!ans)return;
    if(q.multi){ans.indices.forEach(i=>{t=Math.max(t,q.map[i]);});}
    else{t=Math.max(t,q.map[ans.index]);}});
  return t;
}
function echoLines(a){
  const out=[], li=a.leads?a.leads.index:null, ch=a.channels, tm=a.team?a.team.index:null;
  if(li!=null) out.push("Room for "+LEAD_TXT[li]);
  if(ch&&ch.labels&&ch.labels.length) out.push("Leads arriving on "+ch.labels.map(l=>l.toLowerCase()).join(", "));
  if(tm!=null) out.push("Access for "+TEAM_TXT[tm]);
  return out;
}
function chrome(){
  const done = phase==="q" ? pos : TOTAL;
  progEl.innerHTML = Array.from({length:TOTAL},(_,i)=>
    `<div class="seg ${i<done?'done':(i===done?'now':'')}"></div>`).join("");
  stepEl.textContent = phase==="result" ? "Your plan" : (phase==="calc" ? "Matching…" : `Question ${pos+1} of ${TOTAL}`);
}

function render(){
  chrome();
  if(phase==="calc") return renderCalc();
  if(phase==="result") return renderResult();
  renderQuestion();
}

function renderQuestion(){
  const d=QUESTIONS[pos];
  const optsHtml=d.options.map((o,i)=>{
    const on = d.multi ? multiSel.includes(i) : picked===i;
    return `<button type="button" class="opt${on?' on':''}" data-i="${i}">
      <span class="k">${on?'✓':'ABCDE'[i]}</span>
      <span class="lbl">${esc(o)}</span>
      <span class="arw">→</span>
      ${(!d.multi&&picked===i)?'<span class="ring"></span>':''}
    </button>`;}).join("");
  stage.innerHTML=`<div class="fade">
    <div class="kicker">${esc(d.kicker)}</div>
    <h1 class="q">${esc(d.q)}</h1>
    <p class="qSub">${esc(d.sub)}</p>
    <div class="opts">${optsHtml}</div>
    ${d.multi?`<button type="button" class="cont" id="cont" ${multiSel.length?'':'disabled'}>Continue →</button>`:''}
    <div class="footRow">
      ${pos>0?'<button type="button" class="back" id="back">← Back</button>':'<span></span>'}
      <span class="hint">${d.multi?'Pick all that apply · A–E to toggle':'Press A–D or tap to answer'}</span>
    </div></div>`;
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  const c=stage.querySelector("#cont"); if(c) c.onclick=submitMulti;
  const bk=stage.querySelector("#back"); if(bk) bk.onclick=goBack;
}

function renderCalc(){
  stage.innerHTML=`<div class="fade calc"><span class="ring" style="position:static"></span>
    <h2>Matching you to a plan…</h2></div>`;
}

function renderResult(){
  const t=TIERS[recommend(answers)];
  const affirm = t.enterprise ? "" : (AFFIRM[answers.stage?answers.stage.index:0]+" ");
  const key=t.name.toLowerCase();
  const specs=[["Enquiries",t.leads],["Seats",t.seats],["Channels",t.channels],["Unlocks",t.unlocks]];
  const cta = t.enterprise
    ? `<a class="ctaFull" href="${CAL_URL}">Talk to sales</a>
       <a class="ctaLink" href="${PRICING_URL(key)}">Or see all plans</a>`
    : `<a class="ctaFull" href="${PRICING_URL(key)}">Get started with ${esc(t.name)} →</a>
       <a class="ctaLink" href="${CAL_URL}">Want to discuss this plan first? Book a demo</a>`;
  stage.innerHTML=`<div class="fade card">
    <div class="kicker" style="margin-bottom:10px">We recommend</div>
    <div class="recHead">
      <h1 class="recName">${esc(t.name)}</h1>
      <div class="recPriceWrap">
        <div class="recPriceRow"><span class="recPrice">${esc(t.price)}</span><span class="recPer">${esc(t.per)}</span></div>
        <div class="recYear">${esc(t.year)}</div>
      </div>
    </div>
    <p class="recDesc">${esc(affirm+t.gives)}</p>
    <div class="specGrid">${specs.map(([l,v])=>
      `<div class="spec"><div class="specLab">${l}</div><div class="specVal">${esc(v)}</div></div>`).join("")}</div>
    <div class="echo"><div class="echoLab">Based on your answers, you need</div>
      <div class="echoList">${echoLines(answers).map(l=>
        `<div class="echoRow">${TICK}<span>${esc(l)}</span></div>`).join("")}</div></div>
    ${cta}
    <div class="retakeWrap"><button type="button" class="retake" id="retake">Retake</button></div>
  </div>`;
  stage.querySelector("#retake").onclick=()=>{answers={};multiSel=[];picked=null;pos=0;phase="q";render();};
}

function pick(i){
  const d=QUESTIONS[pos];
  if(d.multi){
    multiSel = multiSel.includes(i) ? multiSel.filter(x=>x!==i) : multiSel.concat(i).sort((a,b)=>a-b);
    return updateOptionsUI(null);
  }
  picked=i; updateOptionsUI(i);
  setTimeout(()=>{ answers[d.key]={index:i,label:d.options[i]}; advance(); },240);
}
/* Toggle option state in place instead of calling render() — a full re-render
   restarts the .fade keyframe on the whole card, which on the multi-select
   question caused a visible flicker on every single checkbox click. */
function updateOptionsUI(singleI){
  const d=QUESTIONS[pos];
  stage.querySelectorAll(".opt").forEach(b=>{
    const bi=+b.dataset.i;
    const on = d.multi ? multiSel.includes(bi) : bi===singleI;
    b.classList.toggle("on", on);
    const k=b.querySelector(".k"); if(k) k.textContent = on ? "✓" : "ABCDE"[bi];
    const existingRing=b.querySelector(".ring"); if(existingRing) existingRing.remove();
    if(on && !d.multi){ const ring=document.createElement("span"); ring.className="ring"; b.appendChild(ring); }
  });
  if(d.multi){ const c=stage.querySelector("#cont"); if(c) c.disabled = multiSel.length===0; }
}
function submitMulti(){
  const d=QUESTIONS[pos];
  if(!multiSel.length) return;
  answers[d.key]={indices:multiSel.slice(),labels:multiSel.map(i=>d.options[i])};
  advance();
}
function advance(){
  picked=null; multiSel=[];
  if(pos<TOTAL-1){ pos++; render(); }
  else { phase="calc"; render(); setTimeout(()=>{phase="result";render();},1200); }
}
function goBack(){
  if(phase!=="q"||pos===0) return;
  pos--; picked=null;
  const pq=QUESTIONS[pos], a=answers[pq.key];
  multiSel = (pq.multi&&a) ? a.indices.slice() : [];
  render();
}

document.addEventListener("keydown",e=>{
  if(phase!=="q") return;
  const d=QUESTIONS[pos], i="abcde".indexOf((e.key||"").toLowerCase());
  if(i>=0&&i<d.options.length) pick(i);
  if(e.key==="Enter"&&d.multi) submitMulti();
});

render();
</script>
</body>
</html>
